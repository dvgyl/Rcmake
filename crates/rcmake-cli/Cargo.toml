[package]
name = "rcmake-cli"
description = "Unified multi-call CLI (rcmake / cmake / ctest / cpack) for Rcmake."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["cmake", "build-system", "ctest", "cpack"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "rcmake"
path = "src/main.rs"

[dependencies]
jiff.workspace = true
rcmake-base.workspace = true
rcmake-api = { workspace = true, features = ["native", "archive"] }
rcmake-commands = { workspace = true, features = ["native", "archive"] }
rcmake-cpack.workspace = true
rcmake-ctest.workspace = true
rcmake-diag.workspace = true
rcmake-eval.workspace = true
rcmake-gen-common.workspace = true
rcmake-gen-make.workspace = true
rcmake-gen-ninja.workspace = true
rcmake-genex.workspace = true
rcmake-host.workspace = true
rcmake-instrument.workspace = true
rcmake-json.workspace = true
rcmake-lsp = { workspace = true, features = ["eval", "stdio"] }
rcmake-model.workspace = true
rcmake-presets.workspace = true
rcmake-resolve.workspace = true
rcmake-syntax.workspace = true
rcmake-tool-e.workspace = true
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
rcmake-gen-vs.workspace = true

[target.'cfg(not(windows))'.dependencies]
rcmake-gen-vs = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
rcmake-gen-xcode.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
rcmake-gen-xcode = { workspace = true, optional = true }

[features]
# Make the Visual Studio generators available on every host (structural tests only,
# ADR-015). The release binary never enables this feature.
vs-cross = ["dep:rcmake-gen-vs", "rcmake-model/vs-cross"]
# Compile the Xcode generator for structural tests on other hosts.
xcode-cross = ["dep:rcmake-gen-xcode", "rcmake-model/xcode-cross"]

[lints]
workspace = true
