[package]
name = "rcmake-host"
description = "Deterministic Host trait, NativeHost, PureHost, and shared host conformance suite for Rcmake."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jiff.workspace = true
rcmake-base.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "job-object"] }
winapi-util = "0.1.11"
winreg = { version = "0.56.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "native_process"
harness = false
