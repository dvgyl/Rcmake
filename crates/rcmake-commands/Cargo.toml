[package]
name = "rcmake-commands"
description = "Built-in CMake 4.5.1 command families organized into disjoint submodules."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native", "archive"]
native = ["dep:rcmake-store", "dep:rcmake-fetch", "rcmake-fetch/native"]
archive = ["dep:rcmake-archive"]

[dependencies]
indexmap.workspace = true
jiff.workspace = true
rcmake-archive = { workspace = true, optional = true }
rcmake-base.workspace = true
rcmake-build.workspace = true
rcmake-cps.workspace = true
rcmake-diag.workspace = true
rcmake-eval.workspace = true
rcmake-expr.workspace = true
rcmake-genex.workspace = true
rcmake-host.workspace = true
rcmake-instrument.workspace = true
rcmake-json.workspace = true
rcmake-model.workspace = true
rcmake-regex.workspace = true
rcmake-resolve.workspace = true
rcmake-syntax.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
rcmake-store = { workspace = true, optional = true }
rcmake-fetch = { workspace = true, optional = true }

[lints]
workspace = true
