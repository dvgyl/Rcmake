[package]
name = "rcmake-archive"
description = "Shared archive creation, extraction, and listing engine (tar, gzip, xz, zstd, bzip2, zip) over Host."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bzip2.workspace = true
crc32fast = "1.5"
flate2.workspace = true
jiff.workspace = true
liblzma = { workspace = true, features = ["parallel"] }
ppmd-turbo = "0.2.0"
rcmake-base.workspace = true
rcmake-host.workspace = true
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["bzip2", "compress", "deflate", "zstd"] }
tar.workspace = true
thiserror.workspace = true
zip = { workspace = true, features = ["unreserved"] }
zstd = { workspace = true, features = ["zstdmt"] }

[lints]
workspace = true
