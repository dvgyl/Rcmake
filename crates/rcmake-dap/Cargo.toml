[package]
name = "rcmake-dap"
description = "CMake 4.5.1 Debug Adapter Protocol (--debugger) server for rcmake."
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rcmake-base.workspace = true
rcmake-diag.workspace = true
rcmake-eval.workspace = true
rcmake-host.workspace = true
rcmake-json.workspace = true
rcmake-model.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The transcript tests check that an attached debugger turns off incremental replay.
rcmake-eval = { workspace = true, features = ["replay"] }
