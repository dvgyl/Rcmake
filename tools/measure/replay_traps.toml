"control/control.c" = "int control_fn(void) { return 0; }\n"
"leaf/CMakeLists.txt" = """\
set(X "outer")
block(PROPAGATE X)
  set(X "inner_before")
endblock()
add_library(leaf STATIC leaf.c)
target_compile_definitions(leaf PRIVATE "BLOCK_X=${X}")
"""
"leaf/leaf.c" = "int leaf_fn(void) { return 1; }\n"

