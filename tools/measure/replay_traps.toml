[[trap]]
id = "T04"
name = "macro-target-prop"
stage = "HB.2"
description = "Macro reads get_target_property(x core COMPILE_DEFINITIONS) from another directory."
skip_reason = "Pending macro call-level replay and executed_calls/replayed_calls receipts (HB.2)."
expect_executed = ["core/CMakeLists.txt", "consumer/CMakeLists.txt"]
expect_replayed = ["control/CMakeLists.txt"]
expect_executed_calls = ["read_core_defs"]

[trap.files]
"CMakeLists.txt" = """\
cmake_minimum_required(VERSION 4.5)
project(TrapMacroTargetProp C)
add_subdirectory(control)
add_subdirectory(core)
add_subdirectory(consumer)
"""
"control/CMakeLists.txt" = "add_library(control STATIC control.c)\n"
"control/control.c" = "int control_fn(void) { return 0; }\n"
"core/CMakeLists.txt" = """\
add_library(core STATIC core.c)
target_compile_definitions(core PRIVATE CORE_TAG=before)
"""
"core/core.c" = "int core_fn(void) { return 0; }\n"
"consumer/CMakeLists.txt" = """\
macro(read_core_defs out_tgt)
  get_target_property(_core_defs core COMPILE_DEFINITIONS)
  string(REPLACE "=" "_" _safe_defs "${_core_defs}")
  target_compile_definitions(${out_tgt} PRIVATE "OBSERVED=${_safe_defs}")
endmacro()
add_library(consumer STATIC consumer.c)
read_core_defs(consumer)
"""
"consumer/consumer.c" = "int consumer_fn(void) { return 1; }\n"

[[trap.mutate.replace]]
path = "core/CMakeLists.txt"
old = "CORE_TAG=before"
new = "CORE_TAG=after"

[trap.expect_build_contains]
"build.ninja" = ["OBSERVED=CORE_TAG_after"]


