[[trap]]
id = "T11"
name = "policy-at-call"
stage = "HB.2"
description = "cmake_policy(SET CMP0057 NEW) before a call using IN_LIST; switching to OLD must match diagnostics."
skip_reason = "Pending call-level replay and policy-at-call keying (HB.2)."
expect_initial_exit_code = 0
expect_exit_code = 1
expect_executed = ["leaf/CMakeLists.txt"]
expect_replayed = ["control/CMakeLists.txt"]
expect_executed_calls = ["check_in_list"]
expect_stderr_contains = ["CMP0057"]

[trap.files]
"CMakeLists.txt" = """\
cmake_minimum_required(VERSION 4.5)
project(TrapPolicyAtCall C)
add_subdirectory(control)
add_subdirectory(leaf)
"""
"control/CMakeLists.txt" = "add_library(control STATIC control.c)\n"
"control/control.c" = "int control_fn(void) { return 0; }\n"
"leaf/CMakeLists.txt" = """\
macro(check_in_list tgt)
  set(_items a b c)
  set(_needle b)
  if(_needle IN_LIST _items)
    target_compile_definitions(${tgt} PRIVATE IN_LIST_RES=1)
  else()
    target_compile_definitions(${tgt} PRIVATE IN_LIST_RES=0)
  endif()
endmacro()
add_library(leaf STATIC leaf.c)
cmake_policy(PUSH)
cmake_policy(SET CMP0057 NEW)
check_in_list(leaf)
cmake_policy(POP)
"""
"leaf/leaf.c" = "int leaf_fn(void) { return 1; }\n"

[[trap.mutate.replace]]
path = "leaf/CMakeLists.txt"
old = "cmake_policy(SET CMP0057 NEW)"
new = "cmake_policy(SET CMP0057 OLD)"


