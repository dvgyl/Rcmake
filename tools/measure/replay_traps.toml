[[trap]]
id = "T15"
name = "nested-opaque"
stage = "HB.3"
description = "Function calls a function running execute_process; changing script output must run both calls."
skip_reason = "Pending call-level replay opacity propagation and executed_calls receipts (HB.3)."
expect_executed = ["leaf/CMakeLists.txt"]
expect_replayed = ["control/CMakeLists.txt"]
expect_executed_calls = ["outer_wrap", "inner_proc"]
expect_not_replayed_calls = ["outer_wrap", "inner_proc"]

[trap.files]
"CMakeLists.txt" = """\
cmake_minimum_required(VERSION 4.5)
project(TrapNestedOpaque C)
add_subdirectory(control)
add_subdirectory(leaf)
"""
"control/CMakeLists.txt" = "add_library(control STATIC control.c)\n"
"control/control.c" = "int control_fn(void) { return 0; }\n"
"leaf/script.cmake" = "message(STATUS \"script_out_before\")\n"
"leaf/CMakeLists.txt" = """\
function(inner_proc out_var)
  execute_process(
    COMMAND "${CMAKE_COMMAND}" -P "${CMAKE_CURRENT_SOURCE_DIR}/script.cmake"
    OUTPUT_VARIABLE _out
    OUTPUT_STRIP_TRAILING_WHITESPACE
  )
  string(REPLACE "-- " "" _out "${_out}")
  set(${out_var} "${_out}" PARENT_SCOPE)
endfunction()
function(outer_wrap tgt)
  inner_proc(_res)
  target_compile_definitions(${tgt} PRIVATE "PROC_RES=${_res}")
endfunction()
add_library(leaf STATIC leaf.c)
outer_wrap(leaf)
"""
"leaf/leaf.c" = "int leaf_fn(void) { return 1; }\n"

