[trap.initial_env]
RCMAKE_TRAP = "before"

[trap.files]
"CMakeLists.txt" = """\
cmake_minimum_required(VERSION 4.5)
project(TrapFuncEnv C)
include(cmake/helpers.cmake)
add_subdirectory(control)
add_subdirectory(leaf)
"""
"cmake/helpers.cmake" = """\
function(helper tgt)
  target_compile_definitions(${tgt} PRIVATE "ENV_SEEN=$ENV{RCMAKE_TRAP}")
endfunction()
"""
"control/CMakeLists.txt" = "add_library(control STATIC control.c)\n"
