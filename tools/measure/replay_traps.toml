# Scripted replay soundness traps T01-T25 for tools/measure/mutation_eval.py --traps.
schema_version = 1

[[trap]]
id = "T01"
name = "func-body"
stage = "HB.1"
description = "Leaf calls helper() defined in cmake/helpers.cmake; changing helper body must execute helper."
skip_reason = "Pending call-level replay and executed_calls/replayed_calls receipts (HB.1)."
expect_executed = ["leaf/CMakeLists.txt", "cmake/helpers.cmake"]
expect_replayed = ["control/CMakeLists.txt"]
expect_executed_calls = ["helper"]

[trap.files]
"CMakeLists.txt" = """\
cmake_minimum_required(VERSION 4.5)
project(TrapFuncBody C)
include(cmake/helpers.cmake)
add_subdirectory(control)
add_subdirectory(leaf)
"""
"cmake/helpers.cmake" = """\
function(helper tgt)
  target_compile_definitions(${tgt} PRIVATE HELPER_VAL=1)
endfunction()
"""
"control/CMakeLists.txt" = "add_library(control STATIC control.c)\n"
"control/control.c" = "int control_fn(void) { return 0; }\n"
"leaf/CMakeLists.txt" = """\
add_library(leaf STATIC leaf.c)
helper(leaf)
"""
"leaf/leaf.c" = "int leaf_fn(void) { return 1; }\n"

[[trap.mutate.replace]]
path = "cmake/helpers.cmake"
old = "HELPER_VAL=1"
new = "HELPER_VAL=2"

[trap.expect_build_contains]
"build.ninja" = ["HELPER_VAL=2"]


[[trap]]
id = "T02"
name = "func-redefine"
stage = "HB.1"
description = "helper() defined in two files where second wins; removing second restores first definition."
skip_reason = "Pending call-level replay and executed_calls/replayed_calls receipts (HB.1)."
expect_executed = ["leaf/CMakeLists.txt"]
expect_replayed = ["control/CMakeLists.txt"]
expect_executed_calls = ["helper"]

[trap.files]
"CMakeLists.txt" = """\
cmake_minimum_required(VERSION 4.5)
project(TrapFuncRedefine C)
include(cmake/first.cmake)
include(cmake/second.cmake OPTIONAL)
add_subdirectory(control)
add_subdirectory(leaf)
"""
"cmake/first.cmake" = """\
function(helper tgt)
  target_compile_definitions(${tgt} PRIVATE HELPER_SRC=1)
endfunction()
"""
"cmake/second.cmake" = """\
function(helper tgt)
  target_compile_definitions(${tgt} PRIVATE HELPER_SRC=2)
endfunction()
"""
"control/CMakeLists.txt" = "add_library(control STATIC control.c)\n"
"control/control.c" = "int control_fn(void) { return 0; }\n"
"leaf/CMakeLists.txt" = """\
add_library(leaf STATIC leaf.c)
helper(leaf)
"""
"leaf/leaf.c" = "int leaf_fn(void) { return 1; }\n"

[trap.mutate]
remove = ["cmake/second.cmake"]

[trap.expect_build_contains]
"build.ninja" = ["HELPER_SRC=1"]


