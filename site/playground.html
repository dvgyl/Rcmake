<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground · rcmake</title>
  <meta name="description" content="Edit a CMakeLists.txt file and see rcmake diagnostics, targets, build.ninja, and explain output in the browser.">
  <link rel="canonical" href="https://dvgyl.github.io/rcmake/playground.html">
  <meta property="og:title" content="Playground · rcmake">
  <meta property="og:description" content="Edit a CMakeLists.txt file and see rcmake diagnostics, targets, build.ninja, and explain output in the browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dvgyl.github.io/rcmake/playground.html">
  <meta property="og:image" content="https://dvgyl.github.io/rcmake/assets/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://dvgyl.github.io/rcmake/assets/og-card.png">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script>
    document.documentElement.classList.add("js");
    try {
      const saved = localStorage.getItem("rcmake-theme");
      document.documentElement.dataset.theme = saved || "dark";
    } catch (_) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <svg hidden class="icon-sprite" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></symbol>
    <symbol id="i-cross" viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></symbol>
    <symbol id="i-differs" viewBox="0 0 20 20"><path d="M4 8.5c2-2 4-2 6 0s4 2 6 0M4 12.5c2-2 4-2 6 0s4 2 6 0"/></symbol>
    <symbol id="i-gap" viewBox="0 0 20 20"><path d="M6 10h8"/></symbol>
    <symbol id="i-pending" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5" stroke-dasharray="1.5 2.6"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M6 8l2.5 2L6 12M10.5 12.5H14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.5"/><path d="M13 7V5.5A1.5 1.5 0 0 0 11.5 4h-6A1.5 1.5 0 0 0 4 5.5v6A1.5 1.5 0 0 0 5.5 13H7"/></symbol>
    <symbol id="i-speed" viewBox="0 0 20 20"><circle cx="10" cy="11" r="6"/><path d="M10 11V8M8.5 3h3M15 6l1-1"/></symbol>
    <symbol id="i-forbid" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M5.4 14.6l9.2-9.2"/></symbol>
    <symbol id="i-host" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5"/><path d="M8 2.5v2.5M12 2.5v2.5M8 15v2.5M12 15v2.5M2.5 8h2.5M2.5 12h2.5M15 8h2.5M15 12h2.5"/></symbol>
    <symbol id="i-graph" viewBox="0 0 20 20"><circle cx="5" cy="5" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="15" cy="10" r="2"/><path d="M7 5.8l6 3.2M7 14.2l6-3.2"/></symbol>
    <symbol id="i-layers" viewBox="0 0 20 20"><path d="M10 3l7 3.5-7 3.5-7-3.5zM3 10l7 3.5 7-3.5M3 13.5l7 3.5 7-3.5"/></symbol>
    <symbol id="i-bundle" viewBox="0 0 20 20"><path d="M3.5 6.5L10 3l6.5 3.5v7L10 17l-6.5-3.5zM10 10v7M3.5 6.5L10 10l6.5-3.5"/></symbol>
    <symbol id="i-solution" viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-multi" viewBox="0 0 20 20"><circle cx="5" cy="6" r="1.75"/><circle cx="5" cy="14" r="1.75"/><path d="M7 6h3M7 14h3"/><rect x="11" y="3.5" width="6" height="5" rx="1"/><rect x="11" y="11.5" width="6" height="5" rx="1"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 20 20"><path d="M3 4h14l-5 6v5l-4 2v-7z"/></symbol>
    <symbol id="i-browser" viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M2.5 7.5h15"/></symbol>
    <symbol id="i-tree" viewBox="0 0 20 20"><path d="M5 3v14M5 7h5M5 13h5"/><circle cx="12.5" cy="7" r="2"/><circle cx="12.5" cy="13" r="2"/></symbol>
    <symbol id="i-parity" viewBox="0 0 20 20"><path d="M6 4H4v12h2M14 4h2v12h-2M7.5 8.5h5M7.5 11.5h5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/></symbol>
    <symbol id="i-pin" viewBox="0 0 20 20"><path d="M10 3v9M6.5 8.5L10 12l3.5-3.5M4 15.5h12"/></symbol>
    <symbol id="i-code" viewBox="0 0 20 20"><path d="M7 6l-4 4 4 4M13 6l4 4-4 4"/></symbol>
    <symbol id="i-cache" viewBox="0 0 20 20"><ellipse cx="10" cy="5.5" rx="6" ry="2.5"/><path d="M4 5.5v9c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-9M4 10c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5"/></symbol>
    <symbol id="i-replay" viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 4v3.5h3.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5v11l9-5.5z"/></symbol>
    <symbol id="i-file" viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5zM11.5 2.5V6H15"/></symbol>
    <symbol id="i-target" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><circle cx="10" cy="10" r="3"/></symbol>
    <symbol id="i-theme" viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></symbol>
    <symbol id="i-external" viewBox="0 0 20 20"><path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 20 20"><path d="M4 10h12M11 5l5 5-5 5"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner wide">
      <a class="brand" href="./index.html">
        <img class="mark-dark" src="./assets/rcmake-mark-dark.svg" alt="" width="24" height="24">
        <img class="mark-light" src="./assets/rcmake-mark.svg" alt="" width="24" height="24">
        <span>rcmake</span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a class="opt-overview" href="./index.html">Overview</a>
        <a href="./playground.html" aria-current="page">Playground</a>
        <a href="./dashboard.html">Compatibility</a>
        <a href="https://github.com/dvgyl/rcmake">GitHub<svg class="i" aria-hidden="true"><use href="#i-external"/></svg></a>
        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch to light theme" data-test="theme-toggle">
          <svg class="i" aria-hidden="true"><use href="#i-theme"/></svg>
          <span class="theme-label">Light</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main-content" class="bench">
    <h1 class="visually-hidden">rcmake playground</h1>
    <div class="toolbar">
      <label>Example <select id="example-select" data-test="example-select"><option value="hello-cpp20">Hello C++20</option></select></label>
      <div class="seg" role="radiogroup" aria-label="Generator" id="generator-group" data-test="generator-group">
        <button type="button" role="radio" aria-checked="true" data-gen="Ninja"><svg class="i" aria-hidden="true"><use href="#i-graph"/></svg>Ninja</button>
        <button type="button" role="radio" aria-checked="false" data-gen="Ninja Multi-Config"><svg class="i" aria-hidden="true"><use href="#i-multi"/></svg>Ninja Multi-Config</button>
      </div>
      <label>Build type
        <select id="config-select" data-test="config-select">
          <option>Debug</option>
          <option>Release</option>
          <option>RelWithDebInfo</option>
          <option>MinSizeRel</option>
        </select>
      </label>
      <button id="run-btn" class="ctrl-btn primary" type="button" data-test="run-btn">
        <span id="run-icon"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg></span>
        <span>Run</span>
        <kbd id="run-kbd" class="kbd-hint">&#8984;&#8629;</kbd>
      </button>
      <button id="reset-btn" class="ctrl-btn" type="button" data-test="reset-btn">
        <svg class="i" aria-hidden="true"><use href="#i-replay"/></svg>
        <span>Reset</span>
      </button>
      <span id="mode-badge" class="mode-badge" data-test="mode-badge" aria-live="polite"><span id="mode-badge-text">loading</span></span>
    </div>

    <div class="panes" id="panes">
      <section class="pane pane-editor" id="pane-editor" aria-label="Source files">
        <div id="file-tabs" class="pane-tabs" role="tablist" aria-label="Files" data-test="file-tabs">
          <button type="button" role="tab" aria-selected="true" data-file-tab="CMakeLists.txt"><svg class="i" aria-hidden="true"><use href="#i-file"/></svg>CMakeLists.txt</button>
        </div>
        <div class="editor">
          <pre id="editor-gutter" class="gutter" aria-hidden="true">1</pre>
          <div class="editor-wrap">
            <div id="editor-flash" class="editor-flash" aria-hidden="true"></div>
            <textarea id="editor-textarea" data-test="editor-textarea" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="File contents"></textarea>
          </div>
        </div>
        <div class="statusline">
          <span id="editor-cursor" data-test="editor-cursor">Ln 1, Col 1</span>
          <span id="dirty-indicator" data-test="dirty-indicator"></span>
        </div>
      </section>

      <div id="split-handle" class="split-handle" role="separator" aria-orientation="vertical" aria-label="Resize editor and output panes" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0" data-test="split-handle"></div>

      <section class="pane pane-output" id="pane-output" aria-label="Output">
        <div class="pane-tabs-bar">
          <div class="pane-tabs" role="tablist" aria-label="Output" id="output-tabs" data-test="output-tabs">
            <button type="button" role="tab" data-inspector-tab="ninja" aria-selected="true"><span id="tab-file-name">build.ninja</span> <span id="tab-count-files" class="tab-count"></span></button>
            <button type="button" role="tab" data-inspector-tab="targets" aria-selected="false">Targets <span id="tab-count-targets" class="tab-count"></span></button>
            <button type="button" role="tab" data-inspector-tab="diagnostics" aria-selected="false">Diagnostics <span id="tab-count-diag" class="tab-count"></span></button>
            <button type="button" role="tab" data-inspector-tab="explain" aria-selected="false">Explain</button>
          </div>
          <div class="pane-tabs-actions" id="output-actions" hidden>
            <button id="copy-file-btn" class="ctrl-btn" type="button" hidden data-test="copy-file-btn">
              <svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>
              <span data-copy-label>Copy</span>
            </button>
          </div>
        </div>
        <div id="run-line" class="run-line" aria-hidden="true"><div class="run-line-bar"></div></div>
        <div id="inspector-body" class="output" role="tabpanel" data-test="inspector-body"></div>
        <div class="statusline">
          <span id="run-status" data-test="run-status"></span>
          <span id="run-summary" data-test="run-summary"></span>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./playground.js"></script>
</body>
</html>
