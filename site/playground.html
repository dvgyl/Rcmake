<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground · Rcmake</title>
  <meta name="description" content="Edit a CMakeLists.txt and see Rcmake diagnostics, targets, build.ninja, and explain output in the browser.">
  <meta property="og:title" content="Rcmake playground">
  <meta property="og:description" content="Configure CMake projects with Rcmake in the browser.">
  <meta property="og:image" content="./assets/og-card.svg">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script>
    try {
      const saved = localStorage.getItem("rcmake-theme");
      const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    } catch (_) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="page topbar-inner wide">
      <a class="brand" href="./index.html">
        <img class="mark-light" src="./assets/rcmake-mark.svg" alt="" width="20" height="20">
        <img class="mark-dark" src="./assets/rcmake-mark-dark.svg" alt="" width="20" height="20">
        Rcmake
      </a>
      <nav class="nav" aria-label="Primary">
        <a class="opt" href="./index.html">Overview</a>
        <a href="./playground.html" aria-current="page">Playground</a>
        <a href="./dashboard.html">Compatibility</a>
        <a href="https://github.com/dvgyl/Rcmake">GitHub</a>
        <button id="theme-toggle" type="button">Dark</button>
      </nav>
    </div>
  </header>

  <main class="bench">
    <h1 class="visually-hidden">Rcmake playground</h1>
    <div class="toolbar">
      <label>Example <select id="example-select"></select></label>
      <label>Generator
        <select id="generator-select">
          <option>Ninja</option>
          <option>Ninja Multi-Config</option>
          <option>Unix Makefiles</option>
        </select>
      </label>
      <label>Build type
        <select id="config-select">
          <option>Debug</option>
          <option>Release</option>
          <option>RelWithDebInfo</option>
          <option>MinSizeRel</option>
        </select>
      </label>
      <button id="run-btn" class="btn" type="button" title="Run configure (Ctrl+Enter)">Run</button>
      <button id="reset-btn" class="btn ghost" type="button">Reset</button>
      <span id="runtime" class="runtime" aria-live="polite">loading</span>
    </div>

    <div class="panes">
      <section class="pane" aria-label="Source files">
        <div id="file-tabs" class="tabs" role="tablist" aria-label="Files"></div>
        <div class="editor">
          <pre id="editor-gutter" class="gutter" aria-hidden="true">1</pre>
          <textarea id="editor-textarea" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="File contents"></textarea>
        </div>
        <div class="statusline">
          <span id="editor-cursor">Ln 1, Col 1</span>
          <span id="dirty-indicator"></span>
        </div>
      </section>

      <section class="pane" aria-label="Output">
        <div class="tabs" role="tablist" aria-label="Output">
          <button type="button" role="tab" data-inspector-tab="diagnostics" aria-selected="true">Diagnostics <span id="tab-count-diag"></span></button>
          <button type="button" role="tab" data-inspector-tab="targets" aria-selected="false">Targets <span id="tab-count-targets"></span></button>
          <button type="button" role="tab" data-inspector-tab="ninja" aria-selected="false" id="tab-file-name">build.ninja</button>
          <button type="button" role="tab" data-inspector-tab="explain" aria-selected="false">Explain</button>
          <button id="copy-file-btn" class="text end" type="button" hidden>copy</button>
        </div>
        <div id="inspector-body" class="output" role="tabpanel"></div>
        <div class="statusline">
          <span id="run-status"></span>
          <span id="run-timing"></span>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="./playground.js"></script>
</body>
</html>
