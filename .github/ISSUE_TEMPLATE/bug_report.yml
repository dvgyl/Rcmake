name: Bug or CMake 4.5.1 difference
description: rcmake crashed, failed, or gave a different result from CMake 4.5.1.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Follow SECURITY.md to report them privately.

        Include a short `CMakeLists.txt` and the output from both tools so a maintainer can reproduce the problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: rcmake version
      description: Paste the output of `rcmake --version`, or include the commit SHA of your build.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS Apple silicon
        - macOS Intel
        - Linux x86_64
        - Linux aarch64
        - Windows x86_64
        - Other
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: How did you run it?
      description: The executable name selects the mode.
      options:
        - As cmake, ctest, or cpack in compatibility mode
        - As rcmake in native mode
        - Through rcmake-lsp in an editor
        - In the browser playground
    validations:
      required: true
  - type: input
    id: generator
    attributes:
      label: Generator and compiler
      placeholder: Ninja, Apple clang 17
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal CMakeLists.txt
      description: Paste the smallest project that reproduces the problem. Add extra files if needed.
      render: cmake
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command you ran.
      placeholder: cmake -S . -B build -G Ninja
      render: sh
    validations:
      required: true
  - type: textarea
    id: cmake-output
    attributes:
      label: CMake 4.5.1 output
      description: Paste the output and exit code from running the same command with official CMake 4.5.1. Leave this empty for a crash that does not depend on CMake behavior.
      render: text
  - type: textarea
    id: rcmake-output
    attributes:
      label: rcmake output
      description: Paste the output and exit code from rcmake.
      render: text
    validations:
      required: true
