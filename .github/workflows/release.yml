name: Release

"on":
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.99.1"
  CARGO_BUILD_JOBS: "2"
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - &checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - &python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - &version
        name: Read the workspace version and check the release tag
        id: version
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.+-]+)?$ ]]; then
            printf 'Invalid version in Cargo.toml.\n' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Expected release tag v%s. Found %s.\n' "$version" "$RELEASE_TAG" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build and test the extracted tarball
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/dist.sh --target "$RELEASE_TARGET"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build and test the extracted ZIP archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $root = (Get-Location).Path
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $cargoHome = [IO.Path]::GetFullPath($cargoHome, $root)
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME '.rustup' }
          $rustupHome = [IO.Path]::GetFullPath($rustupHome, $root)
          $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { 'target' }
          $targetDir = [IO.Path]::GetFullPath($targetDir, $root)
          $homePaths = @($HOME, $env:USERPROFILE, $env:HOME) | Where-Object { $_ } | Select-Object -Unique
          $remap = @(
            foreach ($path in $homePaths) { @{ Source = $path; Destination = '/rust-home' } }
            @{ Source = $root; Destination = '/rcmake' }
            @{ Source = $targetDir; Destination = '/target' }
            @{ Source = $cargoHome; Destination = '/cargo' }
            @{ Source = $rustupHome; Destination = '/rustup' }
          )
          $flags = @(
            if (Test-Path Env:CARGO_ENCODED_RUSTFLAGS) {
              if ($env:CARGO_ENCODED_RUSTFLAGS) { $env:CARGO_ENCODED_RUSTFLAGS -split [char]31 }
            } elseif ($env:RUSTFLAGS) {
              $env:RUSTFLAGS -split '[ \t\r\n\v\f]+' | Where-Object { $_ }
            }
            foreach ($mapping in $remap) {
              foreach ($path in @($mapping.Source, $mapping.Source.Replace('\', '/'),
                                  $mapping.Source.Replace('/', '\')) | Select-Object -Unique) {
                "--remap-path-prefix=$path=$($mapping.Destination)"
              }
            }
            '-Clink-arg=/PDBALTPATH:%_PDB%'
          )
          Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]31
          cargo build --locked --release --bin rcmake --target $env:RELEASE_TARGET --target-dir $targetDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $binary = "$targetDir/$env:RELEASE_TARGET/release/rcmake.exe"
          $name = "rcmake-$env:RELEASE_VERSION-$env:RELEASE_TARGET"
          $work = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          $package = Join-Path $work $name
          try {
            New-Item -ItemType Directory -Path "$package/bin", "$package/share", "$package/third_party", 'dist' -Force | Out-Null
            foreach ($tool in 'rcmake', 'cmake', 'ctest', 'cpack') {
              Copy-Item $binary "$package/bin/$tool.exe"
            }
            Copy-Item modules/cmake-4.5 "$package/share/" -Recurse
            Copy-Item third_party/licences "$package/third_party/" -Recurse
            Copy-Item LICENSE-MIT, LICENSE-APACHE, THIRD_PARTY_NOTICES.md $package

            [string[]]$files = @(Get-ChildItem -LiteralPath $package -File -Recurse -Force | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($work, $_.FullName)
              if (-not ($relative -split '[\\/]' | Where-Object { $_ -clike '._*' -or $_ -ceq '.DS_Store' })) {
                $relative
              }
            })
            [Array]::Sort($files, [StringComparer]::Ordinal)
            $archive = Join-Path $work "$name.zip"
            $zip = [IO.Compression.ZipFile]::Open($archive, [IO.Compression.ZipArchiveMode]::Create)
            try {
              foreach ($file in $files) {
                $entry = $zip.CreateEntry($file.Replace('\', '/'), [IO.Compression.CompressionLevel]::Optimal)
                $entry.LastWriteTime = [DateTimeOffset]::new(1980, 1, 1, 0, 0, 0, [TimeSpan]::Zero)
                $entry.ExternalAttributes = 0
                $source = [IO.File]::OpenRead((Join-Path $work $file))
                try {
                  $destination = $entry.Open()
                  try { $source.CopyTo($destination) } finally { $destination.Dispose() }
                } finally {
                  $source.Dispose()
                }
              }
            } finally {
              $zip.Dispose()
            }
            $extracted = Join-Path $work 'extracted'
            Expand-Archive -LiteralPath $archive -DestinationPath $extracted
            $roots = @(
              foreach ($path in $homePaths) { "home=$path" }
              "repository=$root"
              "repository=$env:GITHUB_WORKSPACE"
              "target directory=$targetDir"
              "Cargo home=$cargoHome"
              "Rustup home=$rustupHome"
            )
            bash scripts/dist.sh --verify-extracted "$extracted/$name" "$env:RELEASE_TARGET" @roots
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            "$digest  $name.zip`n" | Set-Content -LiteralPath "dist/$name.zip.sha256" -Encoding ascii -NoNewline
            Move-Item -LiteralPath $archive -Destination "dist/$name.zip" -Force
          } finally {
            Remove-Item -LiteralPath $work -Recurse -Force
          }

      - uses: actions/upload-artifact@v6
        with:
          name: rcmake-${{ matrix.target }}
          path: |
            dist/rcmake-${{ steps.version.outputs.value }}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
            dist/rcmake-${{ steps.version.outputs.value }}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}.sha256
          if-no-files-found: error

  release:
    name: Verify packages and publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - *checkout
      - *python
      - *version
      - uses: actions/download-artifact@v7
        with:
          pattern: rcmake-*
          path: dist
          merge-multiple: true
      - name: Verify package checksums
        working-directory: dist
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          shopt -s dotglob nullglob
          prefix="rcmake-$RELEASE_VERSION"
          archives=(
            "$prefix-aarch64-apple-darwin.tar.gz"
            "$prefix-x86_64-unknown-linux-gnu.tar.gz"
            "$prefix-aarch64-unknown-linux-gnu.tar.gz"
            "$prefix-x86_64-pc-windows-msvc.zip"
          )
          files=(*)
          if [[ ${#files[@]} -ne $((${#archives[@]} * 2)) ]]; then
            printf 'Expected four archives and four matching checksum files.\n' >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            checksum="$(sha256sum -- "$archive")"
            printf '%s\n' "$checksum" | diff -u "$archive.sha256" - >&2
            printf '%s\n' "$checksum"
          done | LC_ALL=C sort -k2 > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach archives to the GitHub Release
        if: github.ref_type == 'tag'
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(*.tar.gz *.zip SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes
          fi
