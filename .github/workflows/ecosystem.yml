# SPDX-License-Identifier: MIT OR Apache-2.0
name: Ecosystem parity

"on":
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      lane:
        description: "Select the tests to run."
        type: choice
        options: [all, vcpkg, conan, large-projects, toolchains, qt, runcmake, runcmake-windows, runcmake-linux, runcmake-macos, conformance]
        default: all
      vcpkg_shard_count:
        description: "Number of vcpkg shards (1 to 128)."
        type: number
        default: 64
      vcpkg_shard_index:
        description: "Zero-based vcpkg shard index. Use -1 to run all shards."
        type: number
        default: -1
      large_projects_full:
        description: "Build the selected targets and run the project checks after configure and dry-run comparison."
        type: boolean
        default: false
      cuda:
        description: "Select the CUDA toolkit for the Linux lane."
        type: choice
        options: [apt, mock]
        default: apt

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  ORACLE_VERSION: "4.5.1"
  ORACLE_LINUX_SHA256: 83b71181fb62b4fe8f26067a9321448572e7a43bd04ff6c7f54a24c33698f16d
  VCPKG_COMMIT: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    permissions:
      contents: read
      actions: write
    outputs:
      run_id: ${{ steps.binary.outputs.run_id }}
      shards: ${{ steps.matrix.outputs.shards }}
      large_projects: ${{ steps.matrix.outputs.large_projects }}
    steps:
      - &checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select matrix entries
        id: matrix
        env:
          SHARD_COUNT: ${{ inputs.vcpkg_shard_count }}
          SHARD_INDEX: ${{ inputs.vcpkg_shard_index }}
        run: |
          source env/env.sh
          timeout 30s python3 - <<'PY'
          import json
          import os
          import tomllib

          count = int(os.environ["SHARD_COUNT"] or "64")
          index = int(os.environ["SHARD_INDEX"] or "-1")
          if not 1 <= count <= 128 or not -1 <= index < count:
              raise SystemExit("Select 1 to 128 shards and a shard index from -1 to count minus one.")
          with open("conformance/corpus/large_projects.toml", "rb") as stream:
              projects = tomllib.load(stream)["project"]
          large_projects = [project["name"] for project in projects if project["l1"]]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("shards=" + json.dumps(list(range(count)) if index == -1 else [index]), file=output)
              print("large_projects=" + json.dumps(large_projects), file=output)
          PY
      - name: Find the CI binaries for this commit
        id: binary
        env:
          GH_TOKEN: ${{ github.token }}
          ECOSYSTEM_LANE: ${{ inputs.lane || 'all' }}
        run: |
          source env/env.sh
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import time

          repo = f"repos/{os.environ['GITHUB_REPOSITORY']}"
          workflow = f"{repo}/actions/workflows/ci.yml"
          sha = os.environ["GITHUB_SHA"]
          ref = os.environ["GITHUB_REF_NAME"]
          lane = os.environ["ECOSYSTEM_LANE"]
          systems = {
              "runcmake-windows": ["windows-2025"],
              "runcmake-linux": ["ubuntu-24.04"],
              "runcmake-macos": ["macos-15"],
              "runcmake": ["ubuntu-24.04", "macos-15", "windows-2025"],
              "all": ["ubuntu-24.04", "macos-15", "windows-2025"],
          }.get(lane, ["ubuntu-24.04"])
          artifacts = {f"rcmake-ci-{system}" for system in systems}
          deadline = time.monotonic() + 5200

          def pause(seconds):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit(f"::error::Timed out waiting for CI artifacts at {sha}.")
              time.sleep(min(seconds, remaining))

          def api(path, *args, method="GET", attempts=3):
              for attempt in range(attempts):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      pause(0)
                  try:
                      result = subprocess.run(
                          ["gh", "api", "--method", method, "-H", "X-GitHub-Api-Version: 2026-03-10",
                           path, *args], timeout=min(30, remaining), check=True,
                          text=True, stdout=subprocess.PIPE)
                      return json.loads(result.stdout) if result.stdout.strip() else None
                  except (subprocess.SubprocessError, OSError, ValueError) as error:
                      if attempt + 1 == attempts:
                          raise SystemExit(f"::error::GitHub API request failed for {path}. {error}")
                      pause(2 ** attempt)

          def runs():
              return api(f"{workflow}/runs", "-f", f"head_sha={sha}", "-F", "per_page=50")["workflow_runs"]

          def available(run_id):
              rows = api(f"{repo}/actions/runs/{run_id}/artifacts", "-F", "per_page=100")["artifacts"]
              return artifacts <= {row["name"] for row in rows if not row["expired"]}

          def publish(run_id):
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  print(f"run_id={run_id}", file=output)

          initial = runs()
          candidates = [run for run in initial
                        if run["event"] in ("push", "workflow_dispatch") and run["head_sha"] == sha]
          for candidate in candidates:
              if available(candidate["id"]):
                  publish(candidate["id"])
                  raise SystemExit(0)

          pending = next((run for run in candidates if run["status"] != "completed"), None)
          if pending:
              run_id = pending["id"]
          else:
              ref_sha = api(f"{repo}/commits/{ref}")["sha"]
              if ref_sha != sha:
                  raise SystemExit("::error::The selected ref moved before CI published the binary.")
              previous = {run["id"] for run in initial}
              dispatched = (
                  dt.datetime.now(dt.timezone.utc).replace(microsecond=0)
                  - dt.timedelta(seconds=60)
              )
              # A dispatch can succeed even if the client loses the response.
              # Do not retry the POST. The next run can detect an existing run.
              response = api(f"{workflow}/dispatches", "-f", f"ref={ref}", method="POST", attempts=1)
              run_id = (response or {}).get("workflow_run_id")
              while run_id is None:
                  candidates = [run for run in runs()
                                if run["id"] not in previous and run["event"] == "workflow_dispatch"
                                and run["head_branch"] == ref and run["head_sha"] == sha
                                and dt.datetime.fromisoformat(run["created_at"]) >= dispatched]
                  if len(candidates) > 1:
                      raise SystemExit("::error::More than one CI run matches the dispatch.")
                  if candidates:
                      run_id = candidates[0]["id"]
                  else:
                      if api(f"{repo}/commits/{ref}")["sha"] != sha:
                          raise SystemExit("::error::The selected ref moved before CI published the binary.")
                      pause(15)

          while True:
              run = api(f"{repo}/actions/runs/{run_id}")
              if run["head_sha"] != sha:
                  raise SystemExit(f"::error::CI run {run_id} uses {run['head_sha']}. Expected {sha}.")
              if available(run_id):
                  publish(run_id)
                  break
              if run["status"] == "completed":
                  raise SystemExit(f"::error::CI run {run_id} concluded with {run['conclusion']} "
                                   f"and did not publish {sorted(artifacts)}.")
              pause(30)
          PY

  vcpkg:
    name: vcpkg shard ${{ matrix.shard }}
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'vcpkg'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      SHARD_COUNT: ${{ inputs.vcpkg_shard_count }}
      SHARD_INDEX: ${{ matrix.shard }}
      VCPKG_FORCE_SYSTEM_BINARIES: "1"
      VCPKG_DISABLE_METRICS: "1"
      VCPKG_MAX_CONCURRENCY: "2"
      VCPKG_BINARY_SOURCES: clear
      VCPKG_COMPARE_MINUTES: "320"
    steps:
      - *checkout
      - &python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - &binary
        uses: actions/download-artifact@v7
        with:
          name: rcmake-ci-ubuntu-24.04
          path: target/stage/bin
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
      - &stage
        name: Stage the Rcmake tools and data
        run: |
          timeout 10s chmod +x target/stage/bin/rcmake
          for tool in cmake ctest cpack rcmake-lsp; do
            timeout 10s ln -sfn rcmake "target/stage/bin/$tool"
          done
          timeout 10s mkdir -p target/stage/share
          timeout 10s ln -sfn "$GITHUB_WORKSPACE/modules/cmake-4.5" target/stage/share/cmake-4.5
          timeout 10s target/stage/bin/cmake --version
          printf 'ECOSYSTEM_RCMAKE=%s\n' "$GITHUB_WORKSPACE/target/stage/bin/cmake" >> "$GITHUB_ENV"
      - &oracle
        name: Fetch the CMake 4.5.1 oracle binary
        run: |
          source env/env.sh
          archive="$RUNNER_TEMP/cmake-linux.tar.gz"
          oracle="$RUNNER_TEMP/cmake-$ORACLE_VERSION-linux-x86_64"
          timeout 120s curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/Kitware/CMake/releases/download/v$ORACLE_VERSION/cmake-$ORACLE_VERSION-linux-x86_64.tar.gz"
          timeout 15s sha256sum --check <<< "$ORACLE_LINUX_SHA256  $archive"
          timeout 60s tar -xzf "$archive" -C "$RUNNER_TEMP"
          timeout 10s "$oracle/bin/cmake" --version
          printf 'ECOSYSTEM_ORACLE=%s\n' "$oracle/bin/cmake" >> "$GITHUB_ENV"
      - name: Install vcpkg tools
        run: |
          source env/env.sh
          timeout 120s sudo apt-get update
          timeout 300s sudo apt-get install -y --no-install-recommends \
            autoconf automake bison curl flex g++ gperf libtool nasm ninja-build \
            patchelf pkg-config python3 tar unzip zip
          timeout 30s git init "$RUNNER_TEMP/vcpkg"
          timeout 180s git -C "$RUNNER_TEMP/vcpkg" fetch --depth=1 \
            https://github.com/microsoft/vcpkg.git "$VCPKG_COMMIT"
          timeout 30s git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          timeout 180s "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Compare port configure results
        run: |
          source env/env.sh
          timeout --kill-after=15s "${VCPKG_COMPARE_MINUTES}m" python3 - <<'PY'
          from collections import Counter
          import json
          import os
          from pathlib import Path
          import shutil
          import signal
          import subprocess
          import time
          from tempfile import TemporaryDirectory

          started = time.monotonic()
          root = Path(os.environ["RUNNER_TEMP"])
          vcpkg = root / "vcpkg"
          report = root / "vcpkg-report"
          report.mkdir()
          count = int(os.environ["SHARD_COUNT"] or "64")
          index = int(os.environ["SHARD_INDEX"])
          all_ports = sorted(path.name for path in (vcpkg / "ports").iterdir()
                             if (path / "portfile.cmake").is_file())
          ports = all_ports[index::count]
          engine_timeout = 120
          kill_wait = 10
          seconds_per_port = 2 * (engine_timeout + kill_wait)
          budget = 60 * int(os.environ["VCPKG_COMPARE_MINUTES"])
          worst_case = len(ports) * seconds_per_port
          shard = {
              "shard_index": index, "shard_count": count, "expected_ports": len(ports),
              "worst_case_seconds": worst_case, "budget_seconds": budget,
              "install_passed": {"oracle": 0, "rcmake": 0},
          }

          def save_shard():
              shard["duration_seconds"] = round(time.monotonic() - started, 3)
              (report / "shard.json").write_text(json.dumps(shard, indent=2) + "\n", encoding="utf-8")

          save_shard()
          print(f"vcpkg shard {index}/{count} has {len(ports)} ports. "
                f"Allow up to {worst_case} seconds for the two engines.", flush=True)
          # Reserve time for report and build directory cleanup.
          max_ports = (budget - 60) // seconds_per_port
          if len(ports) > max_ports:
              minimum_shards = (len(all_ports) + max_ports - 1) // max_ports
              raise SystemExit(f"The shard exceeds the comparison time budget. "
                               f"Set vcpkg_shard_count to at least {minimum_shards}.")

          engines = {}
          for name, variable in (("oracle", "ECOSYSTEM_ORACLE"), ("rcmake", "ECOSYSTEM_RCMAKE")):
              expected = Path(os.environ[variable]).resolve(strict=True)
              env = os.environ.copy()
              env["PATH"] = str(Path(env[variable]).parent) + os.pathsep + env["PATH"]
              tool = shutil.which("cmake", path=env["PATH"])
              if not tool or Path(tool).resolve(strict=True) != expected:
                  raise SystemExit(f"PATH selected an unexpected CMake executable for {name}: {tool}")
              version = subprocess.check_output([tool, "--version"], env=env, timeout=10).splitlines()
              if version[:1] != [b"cmake version 4.5.1"] or (name == "rcmake") != any(
                      b"Rcmake" in line for line in version):
                  raise SystemExit(f"Incorrect CMake executable for {name}.")
              engines[name] = (expected, env)

          def observe(port_build, expected):
              profiles = []
              identity_errors = []
              marker = "CMAKE_COMMAND:INTERNAL="
              for tree in sorted(port_build.glob("x64-linux-*")):
                  cache = tree / "CMakeCache.txt"
                  if not cache.is_file() or not any(
                          (tree / file).is_file() for file in ("build.ninja", "Makefile")):
                      continue
                  values = [line.removeprefix(marker) for line in
                            cache.read_text(errors="replace").splitlines() if line.startswith(marker)]
                  if len(values) != 1 or not Path(values[0]).is_absolute() or Path(values[0]).resolve() != expected:
                      identity_errors.append({"profile": tree.name, "commands": values})
                  else:
                      profiles.append(tree.name.removeprefix("x64-linux-"))
              return profiles, identity_errors

          def configure(port, name, work, expected, env):
              buildtrees = work / "buildtrees"
              buildtrees.mkdir(parents=True)
              command = [
                  str(vcpkg / "vcpkg"), "install", f"{port}:x64-linux", "--classic",
                  "--allow-unsupported", "--clean-packages-after-build",
                  f"--x-buildtrees-root={buildtrees}", f"--x-install-root={work / 'installed'}",
                  f"--x-packages-root={work / 'packages'}",
              ]
              with (report / f"{port}-{name}.log").open("w") as log:
                  with subprocess.Popen(command, cwd=vcpkg, env=env, stdout=log,
                                        stderr=subprocess.STDOUT, start_new_session=True) as proc:
                      try:
                          result = proc.wait(timeout=engine_timeout)
                      except subprocess.TimeoutExpired:
                          try:
                              os.killpg(proc.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          proc.wait(timeout=kill_wait)
                          result = 124
              profiles, identity_errors = observe(buildtrees / port, expected)
              return {"configure_profiles": profiles, "identity_errors": identity_errors, "install_exit": result}

          def score(left, right):
              if left["identity_errors"] or right["identity_errors"]:
                  return "cmake-identity-mismatch"
              if left["configure_profiles"]:
                  if left["configure_profiles"] == right["configure_profiles"]:
                      return "pass"
                  return "configure-mismatch"
              if left["install_exit"] == 0:
                  return "no-observed-cmake-configure"
              return "oracle-blocked-before-configure"

          summary = Counter()
          scored = 0
          with (report / "results.jsonl").open("w", buffering=1) as rows:
              for port in ports:
                  with TemporaryDirectory(prefix=f"vcpkg-{port}-", dir=root) as temporary:
                      work = Path(temporary)
                      left = configure(port, "oracle", work / "oracle", *engines["oracle"])
                      right = configure(port, "rcmake", work / "rcmake", *engines["rcmake"])
                  status = score(left, right)
                  scored += bool(left["configure_profiles"])
                  summary[status] += 1
                  shard["install_passed"]["oracle"] += left["install_exit"] == 0
                  shard["install_passed"]["rcmake"] += right["install_exit"] == 0
                  print(json.dumps({"port": port, "status": status, "oracle": left, "rcmake": right}),
                        file=rows)
                  shard["configure_results"] = dict(summary)
                  save_shard()
                  print(port, status, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              print(f"vcpkg shard {index}/{count}. {scored} of {len(ports)} ports scored.", file=output)
              for status, total in sorted(summary.items()):
                  print(f"- Configure {status}: {total}", file=output)
              for engine, total in shard["install_passed"].items():
                  print(f"- {engine} installs passed: {total}/{len(ports)}", file=output)
              print(f"- Duration: {shard['duration_seconds']:.1f} seconds", file=output)
          if not scored:
              raise SystemExit("The shard did not score any CMake ports.")
          raise SystemExit(bool(summary["configure-mismatch"] or summary["cmake-identity-mismatch"]))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vcpkg-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/vcpkg-report
          if-no-files-found: ignore

  conan:
    name: Conan CMakeToolchain and CMakeDeps
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'conan'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - *checkout
      - *python
      - *binary
      - *stage
      - *oracle
      - name: Install Conan and Ninja
        run: |
          source env/env.sh
          timeout 120s sudo apt-get update
          timeout 180s sudo apt-get install -y --no-install-recommends gcc-13 g++-13 ninja-build
          timeout 180s python3 -m pip install 'conan==2.18.1'
      - name: Configure and build the same Conan consumer
        run: |
          source env/env.sh
          timeout 240s python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"]) / "conan-fixture"
          root.mkdir()
          dep = root / "dependency"
          dep.mkdir()
          app = root / "consumer"
          app.mkdir()
          (dep / "conanfile.py").write_text("""from conan import ConanFile
          from conan.tools.files import copy
          import os

          class Demo(ConanFile):
              name = "ecodemo"
              version = "1.0"
              package_type = "header-library"
              exports_sources = "answer.h"

              def package(self):
                  copy(self, "answer.h", self.source_folder, os.path.join(self.package_folder, "include"))

              def package_info(self):
                  self.cpp_info.libdirs = []
                  self.cpp_info.bindirs = []
          """)
          (dep / "answer.h").write_text("#pragma once\nconstexpr int answer = 42;\n")
          (app / "conanfile.py").write_text("""from conan import ConanFile
          from conan.tools.cmake import cmake_layout

          class Consumer(ConanFile):
              settings = "os", "arch", "compiler", "build_type"
              requires = "ecodemo/1.0"
              generators = "CMakeToolchain", "CMakeDeps"

              def layout(self):
                  cmake_layout(self)
          """)
          (app / "CMakeLists.txt").write_text("""cmake_minimum_required(VERSION 3.25)
          project(ConanConsumer LANGUAGES CXX)
          find_package(ecodemo CONFIG REQUIRED)
          add_executable(answer main.cpp)
          target_link_libraries(answer PRIVATE ecodemo::ecodemo)
          """)
          (app / "main.cpp").write_text(
              '#include <answer.h>\n#include <iostream>\nint main() { std::cout << answer << "\\n"; }\n'
          )
          env = {**os.environ, "CONAN_HOME": str(root / "home"),
                 "CC": "/usr/bin/gcc-13", "CXX": "/usr/bin/g++-13"}
          profile = root / "profile"
          profile.write_text("""[settings]
          os=Linux
          arch=x86_64
          compiler=gcc
          compiler.version=13
          compiler.libcxx=libstdc++11
          compiler.cppstd=17
          build_type=Release
          """)
          profiles = ["-pr:h", str(profile), "-pr:b", str(profile)]

          def run(*command, cwd=root):
              return subprocess.check_output(command, cwd=cwd, env=env, timeout=60, text=True)

          run("conan", "create", str(dep), "--no-remote", *profiles)
          run("conan", "install", ".", "--no-remote", "--build=missing", *profiles,
              "-c", "tools.cmake.cmaketoolchain:generator=Ninja", cwd=app)
          results = {}
          for name, variable in (("oracle", "ECOSYSTEM_ORACLE"), ("rcmake", "ECOSYSTEM_RCMAKE")):
              cmake = env[variable]
              try:
                  print(run(cmake, "--preset", "conan-release", cwd=app), flush=True)
                  print(run(cmake, "--build", "--preset", "conan-release", cwd=app), flush=True)
                  results[name] = run(app / "build/Release/answer", cwd=app)
              except subprocess.CalledProcessError as error:
                  print(error.output, flush=True)
                  results[name] = f"Exit {error.returncode}: {error.cmd}"
              build = app / "build/Release"
              if build.exists():
                  build.rename(root / name)
                  generators = root / name / "generators"
                  if generators.is_dir():
                      build.mkdir()
                      generators.rename(build / "generators")
          print(results, flush=True)
          raise SystemExit(results != {"oracle": "42\n", "rcmake": "42\n"})
          PY

  large-projects:
    name: Large-project parity / ${{ matrix.project }}
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'large-projects'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.large_projects_full && 350 || 75 }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        project: ${{ fromJSON(needs.prepare.outputs.large_projects) }}
    env:
      CORPUS_PROJECT: ${{ matrix.project }}
      LARGE_PROJECTS_FULL: ${{ inputs.large_projects_full }}
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - *checkout
      - *python
      - *binary
      - *stage
      - *oracle
      - name: Report available disk space and memory
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free -h
      - name: Set up project prerequisites
        run: |
          source env/env.sh
          if [[ "$CORPUS_PROJECT" == rclcpp ]]; then
            ros_package="$RUNNER_TEMP/ros2-apt-source.deb"
            timeout 90s curl --fail --location --retry 3 --output "$ros_package" \
              https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.3.0/ros2-apt-source_1.3.0.noble_all.deb
            timeout 15s sha256sum --check <<< "f31d84adf5054c7d60ded0e82c0f776a77ea33af53d08f40b9ad7c94cca55296  $ros_package"
            timeout 60s sudo dpkg -i "$ros_package"
          fi
          timeout 120s sudo apt-get update
          timeout 25m python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tomllib

          with open("conformance/corpus/large_projects.toml", "rb") as stream:
              pin = next(row for row in tomllib.load(stream)["project"]
                         if row["name"] == os.environ["CORPUS_PROJECT"])
          apt = ["ninja-build", "g++", "pkg-config", *pin.get("apt", [])]
          if pin.get("use_ros_jazzy"):
              apt.extend(["ros-jazzy-ros-base", "python3-catkin-pkg"])
          subprocess.run(["sudo", "apt-get", "install", "-y", "--no-install-recommends", *apt],
                         timeout=900, check=True)
          python = pin.get("python", [])
          if pin.get("use_qt"):
              python = [*python, "aqtinstall==3.3.0"]
          if python:
              subprocess.run([sys.executable, "-m", "pip", "install", *python], timeout=300, check=True)
          if pin.get("use_qt"):
              output = Path(os.environ["RUNNER_TEMP"]) / "qt"
              subprocess.run([sys.executable, "-m", "aqt", "install-qt", "linux", "desktop", "6.8.3",
                              "linux_gcc_64", "--outputdir", output], timeout=780, check=True)
          PY
      - name: Compare configure data and run the selected checks
        run: |
          source env/env.sh
          if [[ "$CORPUS_PROJECT" == rclcpp ]]; then
            source /opt/ros/jazzy/setup.bash
          fi
          limit=44m
          if [[ "$LARGE_PROJECTS_FULL" == true ]]; then
            limit=300m
          fi
          timeout --signal=INT --kill-after=15s "$limit" python3 - <<'PY'
          from collections import Counter
          import itertools
          import json
          import os
          from pathlib import Path
          import resource
          import shutil
          import subprocess
          import sys
          import tomllib

          sys.path.insert(0, "tools/measure")
          from ninja_canon import Normalizer, canonicalize, differences, dry_run, row_key

          # The File API members with backtrace indexes or reply file names.
          # An index changes when an unrelated node changes.
          MODEL_IGNORED_KEYS = {"backtrace", "backtraces", "backtraceGraph", "jsonFile"}
          # Cache entries whose value is the configure time. Only the value is hidden.
          NONDETERMINISTIC_CACHE_KEYS = ("OPENCV_TIMESTAMP",)
          DIFF_LINES = 2000

          with open("conformance/corpus/large_projects.toml", "rb") as stream:
              pin = next(row for row in tomllib.load(stream)["project"]
                         if row["name"] == os.environ["CORPUS_PROJECT"])
          work = Path(os.environ["RUNNER_TEMP"]) / "large-projects"
          work.mkdir()
          report = work / "report"
          report.mkdir()
          full = os.environ.get("LARGE_PROJECTS_FULL") == "true"
          result = {
              "project": pin["name"], "commit": pin["commit"], "rcmake_sha": os.environ["GITHUB_SHA"],
              "l1_status": "incomplete", "l2_status": "incomplete",
              "l3_status": "incomplete" if full else "not_requested",
              "l4_status": "incomplete" if full else "not_requested",
              "l1": {}, "l2": "incomplete", "status": "incomplete", "checks": {},
          }

          def save_result():
              (report / "result.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")

          save_result()
          oracle = Path(os.environ["ECOSYSTEM_ORACLE"])
          rcmake = Path(os.environ["ECOSYSTEM_RCMAKE"])
          memory = pin["runner"]["memory_gib"] * 1024**3
          resource.setrlimit(resource.RLIMIT_AS, (memory, memory))

          def run(command, timeout=480):
              return subprocess.run(command, check=True, timeout=timeout)

          def checkout(entry, destination):
              run(["git", "init", destination], 20)
              run(["git", "-C", destination, "remote", "add", "origin",
                   f"https://github.com/{entry['repository']}.git"], 20)
              run(["git", "-C", destination, "fetch", "--depth=1", "origin", entry["commit"]], 480)
              run(["git", "-C", destination, "checkout", "--detach", "FETCH_HEAD"], 120)
              if entry.get("submodules"):
                  run(["git", "-C", destination, "submodule", "update", "--init", "--recursive",
                       "--depth=1", "--jobs=4"], 900)

          source = work / "source"
          git = ["git", "-C", source]
          prefix = [work / "prerequisites"]

          def source_status():
              revision = subprocess.check_output([*git, "rev-parse", "HEAD"], timeout=20, text=True).strip()
              if revision != pin["commit"]:
                  raise ValueError(f"The source commit changed to {revision}.")
              return subprocess.check_output(
                  [*git, "status", "--porcelain", "--ignored", "--ignore-submodules=none"],
                  timeout=120, text=True,
              )

          def reset_source():
              run([*git, "checkout", pin["commit"], "--", "."], 120)
              run([*git, "clean", "-fdx"], 120)
              if pin.get("submodules"):
                  run([*git, "submodule", "update", "--checkout", "--force", "--recursive"], 300)
                  run([*git, "submodule", "foreach", "--recursive", "git clean -fdx"], 300)

          cmake_source = source / pin.get("source_subdir", ".")
          build = work / "build"
          install = work / "install"

          def codemodel(normalize):
              reply = build / ".cmake/api/v1/reply"
              index_file = next(reply.glob("index-*.json"))
              name = json.loads(index_file.read_text())["reply"]["codemodel-v2"]["jsonFile"]

              def read(value):
                  if isinstance(value, list):
                      return [read(item) for item in value]
                  if isinstance(value, dict):
                      row = {key: read(item) for key, item in value.items()
                             if key not in MODEL_IGNORED_KEYS}
                      if "jsonFile" in value:
                          row["data"] = read(json.loads((reply / value["jsonFile"]).read_text()))
                      # CMake can emit target dependency IDs in a different order on each run.
                      for key in ("dependencies", "orderDependencies"):
                          if key in row:
                              row[key].sort(key=lambda dependency: dependency["id"])
                      return row
                  if isinstance(value, str):
                      return normalize.text(value)
                  return value

              return [read(json.loads((reply / name).read_text()))]

          def full_checks(name, cmake, checks):
              def check(label, command, timeout=3600):
                  checks[label] = "fail"
                  with (report / f"{name}-{label}.log").open("w") as log:
                      subprocess.run(command, cwd=build, stdout=log, stderr=subprocess.STDOUT,
                                     check=True, timeout=timeout)
                  checks[label] = "pass"
                  save_result()

              check("l3", [cmake, "--build", build, "--parallel", "2", "--target", *pin["l3_targets"]])
              l4 = pin["l4"]
              checks["l4"] = "fail"
              if l4.get("ninja"):
                  check("test-targets", [cmake, "--build", build, "--parallel", "2",
                                         "--target", *l4["ninja"]])
              if l4.get("ctest"):
                  check("ctest", [cmake.with_name("ctest"), "--test-dir", build, "--no-tests=error",
                                  "--output-on-failure", *l4["ctest"]], 1800)
              for index, target in enumerate(l4.get("executables", [])):
                  check(f"test-executable-{index}", [build / target], 1800)
              if l4.get("install"):
                  check("install", [cmake, "--build", build, "--parallel", "2", "--target", "install"])
              checks["l4"] = "pass"

          def configure(name, cmake, checks):
              query = build / ".cmake/api/v1/query"
              query.mkdir(parents=True)
              (query / "codemodel-v2").touch()
              # The tool labels come before <cmake>. The Rcmake tools are symbolic
              # links to one program, so the resolved path must keep <cmake>.
              normalize = Normalizer(build, source, {
                  **{cmake.with_name(tool): f"<{tool}>" for tool in ("ctest", "cpack", "ccmake")},
                  cmake: "<cmake>", install: "<install>",
                  cmake.parent.parent / "share/cmake-4.5": "<cmake-data>",
              })
              command = [cmake, "-S", cmake_source, "-B", build, "-G", "Ninja",
                         "-DCMAKE_BUILD_TYPE=Release", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
                         f"-DCMAKE_INSTALL_PREFIX={install}",
                         "-DCMAKE_PREFIX_PATH=" + ";".join(map(str, prefix)),
                         *pin["configure_args"]]
              if pin.get("use_ros_jazzy"):
                  command.append("-DPython3_EXECUTABLE=/usr/bin/python3")
              if full and pin["name"] == "opencv":
                  command += ["-DBUILD_LIST=core,imgproc,imgcodecs,ts",
                              f"-DOPENCV_TEST_DATA_PATH={work / 'opencv-extra/testdata'}"]
              try:
                  with (report / f"{name}.stderr").open("w") as log:
                      subprocess.run(command, timeout=600, check=True, stderr=log)
                  cache = sorted(
                      line.partition("=")[0] + "=<nondeterministic>"
                      if line.startswith(tuple(f"{key}:" for key in NONDETERMINISTIC_CACHE_KEYS))
                      else normalize.text(line)
                      for line in (build / "CMakeCache.txt").read_text().splitlines()
                      if line and not line.startswith(("#", "//")))
                  diagnostics = [normalize.text((report / f"{name}.stderr").read_text())]
                  observed = {
                      "diagnostics": diagnostics,
                      "cache": cache,
                      "codemodel": codemodel(normalize),
                      "edges": canonicalize(normalize),
                  }
              except (OSError, KeyError, ValueError, StopIteration, subprocess.SubprocessError) as error:
                  checks["configure"] = "fail"
                  checks["configure_error"] = str(error)
                  return {}
              checks["configure"] = "pass"
              try:
                  commands = dry_run(normalize, pin["l2_targets"])
                  if not commands:
                      raise ValueError("The Ninja dry run produced no commands.")
                  observed["commands"] = commands
                  checks["dry_run"] = "pass"
              except (OSError, ValueError, subprocess.SubprocessError) as error:
                  checks.update(dry_run="fail", dry_run_error=str(error))
              return observed

          def run_lane(name, cmake):
              checks = result["checks"][name] = {}
              before = source_status()
              if before:
                  raise ValueError(f"Source was modified before the {name} run.\n{before}")
              try:
                  observed = configure(name, cmake, checks)
                  if observed and full:
                      try:
                          full_checks(name, cmake, checks)
                      except (OSError, subprocess.SubprocessError) as error:
                          checks["full_error"] = str(error)
              finally:
                  after = source_status()
                  (report / f"{name}-source-status.txt").write_text(after, encoding="utf-8")
                  checks["source_clean"] = not after
                  save_result()
                  if full:
                      for directory in (build, install):
                          if directory.exists():
                              shutil.rmtree(directory)
                  elif build.exists():
                      build.rename(work / name)
              return observed

          def compare(results, summary):
              for key, left in results["oracle"].items():
                  if key not in results["rcmake"]:
                      continue
                  right = results["rcmake"][key]
                  level = "L2" if key == "commands" else "L1"
                  status = "equal" if left == right else "different"
                  if level == "L1":
                      result["l1"][key] = status
                  else:
                      result["l2"] = status
                  if status == "equal":
                      print(f"- {level} {key}: pass", file=summary)
                      continue
                  with (report / f"{key}.diff").open("w") as output:
                      for line in itertools.islice(differences(left, right), DIFF_LINES):
                          print(line, file=output)
                  # The diff can stop before the Rcmake side. The counts and samples show both sides.
                  first, second = Counter(map(row_key, left)), Counter(map(row_key, right))
                  oracle_only, rcmake_only = first - second, second - first
                  (report / f"{key}.summary.json").write_text(json.dumps({
                      "oracle_rows": sum(first.values()), "rcmake_rows": sum(second.values()),
                      "oracle_only": sum(oracle_only.values()), "rcmake_only": sum(rcmake_only.values()),
                      "oracle_only_sample": list(itertools.islice(oracle_only.elements(), 50)),
                      "rcmake_only_sample": list(itertools.islice(rcmake_only.elements(), 50)),
                  }, indent=2) + "\n")
                  print(f"- {level} {key}: different ({sum(oracle_only.values())} oracle-only, "
                        f"{sum(rcmake_only.values())} Rcmake-only rows)", file=summary)
          try:
              if pin.get("use_qt"):
                  prefix.append(Path(os.environ["RUNNER_TEMP"]) / "qt/6.8.3/gcc_64")
              for index, prerequisite in enumerate(pin.get("prerequisite", [])):
                  dependency = work / f"dependency-{index}"
                  checkout(prerequisite, dependency)
                  deps_build = work / f"dependency-{index}-build"
                  run([oracle, "-S", dependency, "-B", deps_build, "-G", "Ninja",
                       *prerequisite["configure_args"]])
                  run([oracle, "--build", deps_build, "--parallel", "2"])
                  run([oracle, "--install", deps_build, "--prefix", prefix[0]])

              checkout(pin, source)
              if full and pin["name"] == "opencv":
                  checkout({"repository": "opencv/opencv_extra", "commit": "refs/tags/4.12.0"},
                           work / "opencv-extra")
                  os.environ["OPENCV_TEST_DATA_PATH"] = str(work / "opencv-extra/testdata")
              results = {"oracle": run_lane("oracle", oracle)}
              reset_source()
              results["rcmake"] = run_lane("rcmake", rcmake)

              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  compare(results, summary)
                  if result["l1"]:
                      result["l1_status"] = "pass" if all(
                          value == "equal" for value in result["l1"].values()) else "fail"
                  if result["l2"] != "incomplete":
                      result["l2_status"] = "pass" if result["l2"] == "equal" else "fail"
                  required = ["l1_status", "l2_status"]
                  if full:
                      for level in ("l3", "l4"):
                          states = [lane.get(level, "incomplete") for lane in result["checks"].values()]
                          status = "pass" if states == ["pass", "pass"] else (
                              "fail" if "fail" in states else "incomplete")
                          result[f"{level}_status"] = status
                          required.append(f"{level}_status")
                  for key in required:
                      print(f"- {key}: {result[key]}", file=summary)
                  for name, checks in result["checks"].items():
                      print(f"- {name} source clean: {checks['source_clean']}", file=summary)
                  passed = all(result[key] == "pass" for key in required) and all(
                      lane["source_clean"] for lane in result["checks"].values())
                  result["status"] = "pass" if passed else (
                      "oracle_error" if not results["oracle"] else "fail")
          except (OSError, ValueError, subprocess.SubprocessError, KeyboardInterrupt) as error:
              result["error"] = str(error) or "Project comparison interrupted."
              raise
          finally:
              save_result()
          raise SystemExit(result["status"] != "pass")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: large-projects-${{ matrix.project }}
          path: ${{ runner.temp }}/large-projects/report
          if-no-files-found: ignore

  runcmake-linux:
    name: Full RunCMake on Linux
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'runcmake' || inputs.lane == 'runcmake-linux'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CI_BINARY: rcmake-ci-ubuntu-24.04
      RUNCMAKE_PROFILE: linux
      RUNCMAKE_REPORT: runcmake-linux.json
    steps:
      - *checkout
      - *python
      - &runcmake_binary
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.CI_BINARY }}
          path: target/stage/bin
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang ninja-build make binutils libzstd1 pkg-config rpm
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/appimage-runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum --check <<EOF
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/appimage-runtime
          EOF
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - &runcmake_stage
        name: Stage the Rcmake tools and data
        run: |
          mkdir -p target/stage/share
          if [[ "$RUNNER_OS" == Windows ]]; then
            for tool in cmake ctest cpack; do
              cp target/stage/bin/rcmake.exe "target/stage/bin/$tool.exe"
            done
            cp -R modules/cmake-4.5 target/stage/share/
          else
            chmod +x target/stage/bin/rcmake
            for tool in cmake ctest cpack; do
              ln -sfn rcmake "target/stage/bin/$tool"
            done
            ln -sfn "$GITHUB_WORKSPACE/modules/cmake-4.5" target/stage/share/cmake-4.5
          fi
      - &runcmake_run
        name: Compare RunCMake cases with CMake 4.5.1
        timeout-minutes: 330
        run: |
          source env/env.sh
          oracle_env="$(scripts/fetch-oracle.sh --print-env)"
          eval "$oracle_env"
          if [[ "$RUNNER_OS" == Windows ]]; then
            for variable in RCMAKE_ORACLE_CMAKE RCMAKE_ORACLE_CTEST RCMAKE_ORACLE_CPACK \
                            RCMAKE_ORACLE_SRC RCMAKE_ORACLE_RUNCMAKE_DIR RCMAKE_VENDORED_DATA_ROOT; do
              export "$variable=$(cygpath -am "${!variable}")"
            done
            msvc_bin="$(cygpath -u "${VCToolsInstallDir%\\}/bin/Hostx64/x64")"
            export PATH="$msvc_bin:$PATH"
            command -v cl.exe link.exe nmake.exe ninja
          fi
          options=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            export APPIMAGE_EXTRACT_AND_RUN=1
            options=(--test-var CMake_TEST_CPACK_APPIMAGE=ON
                     --test-var "CMake_TEST_CPACK_APPIMAGE_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime")
          fi
          python tools/measure/runcmake_eval.py --profile "$RUNCMAKE_PROFILE" \
            --stage target/stage/bin --json "$RUNCMAKE_REPORT" --min-pass-rate 99.0 "${options[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runcmake-linux-full
          path: ${{ env.RUNCMAKE_REPORT }}
          if-no-files-found: error

  runcmake-macos:
    name: Full RunCMake on macOS
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'runcmake' || inputs.lane == 'runcmake-macos'
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 350
    env:
      CI_BINARY: rcmake-ci-macos-15
      RUNCMAKE_PROFILE: all-macos
      RUNCMAKE_REPORT: runcmake-macos.json
    steps:
      - *checkout
      - *python
      - *runcmake_binary
      - name: Check Xcode and install missing build tools
        run: |
          xcodebuild -version
          if ! command -v ninja >/dev/null; then
            brew install ninja
          fi
          if ! command -v pkg-config >/dev/null; then
            brew install pkgconf
          fi
          ninja --version
      - *runcmake_stage
      - *runcmake_run
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runcmake-macos-full
          path: ${{ env.RUNCMAKE_REPORT }}
          if-no-files-found: error

  runcmake-windows:
    name: Full RunCMake on Windows
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'runcmake' || inputs.lane == 'runcmake-windows'
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 350
    env:
      CI_BINARY: rcmake-ci-windows-2025
      RUNCMAKE_PROFILE: windows
      RUNCMAKE_REPORT: runcmake-windows.json
    steps:
      - *checkout
      - *python
      - *runcmake_binary
      - name: Install Visual Studio 2022 Build Tools
        shell: pwsh
        timeout-minutes: 25
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $search = @('-latest', '-products', '*', '-version', '[17.0,18.0)',
                      '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                      '-property', 'installationPath')
          $instance = & $vswhere @search
          if (-not $instance) {
            $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
            Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installer
            $arguments = @('--quiet', '--wait', '--norestart', '--nocache',
                           '--add', 'Microsoft.VisualStudio.Workload.VCTools',
                           '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                           '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin 0, 3010) { throw "Build Tools installer exited with $($process.ExitCode)." }
            $instance = & $vswhere @search
          }
          if (-not $instance) { throw 'Visual Studio 2022 Build Tools are missing.' }
          Join-Path $instance 'MSBuild\Current\Bin\amd64' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
      - name: Install Windows build and packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @{ninja='ninja'; nuget='nuget.commandline'; candle='wixtoolset'}.GetEnumerator()) {
            if (-not (Get-Command "$($tool.Key).exe" -ErrorAction SilentlyContinue)) {
              choco install $tool.Value -y --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter 'WiX Toolset v3.*' |
              Sort-Object Name -Descending | Select-Object -First 1
            if (-not $wix) { throw 'WiX 3 is missing.' }
            $wixBin = Join-Path $wix.FullName bin
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - *runcmake_stage
      - *runcmake_run
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runcmake-windows
          path: ${{ env.RUNCMAKE_REPORT }}
          if-no-files-found: error

  conformance:
    name: CLI and differential conformance
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'conformance'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - *checkout
      - *python
      - *binary
      - *stage
      - *oracle
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Check CLI behavior and the language server
        run: |
          source env/env.sh
          mkdir -p conformance-report
          python3 conformance/cases/cli-ux/verify.py --rcmake target/stage/bin/rcmake \
            --lsp target/stage/bin/rcmake-lsp --oracle "$ECOSYSTEM_ORACLE" 2>&1 | tee conformance-report/cli-ux.log
      - name: Run differential tests with the CMake oracle
        if: success() || failure()
        run: |
          source env/env.sh
          mkdir -p conformance-report
          RCMAKE_ORACLE_CMAKE="$ECOSYSTEM_ORACLE" python3 tools/measure/oracle_prop_test.py \
            --rcmake-bin target/stage/bin/rcmake --out conformance-report/oracle-prop.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: conformance
          path: conformance-report
          if-no-files-found: error

  linux-extended:
    name: Linux extended conformance
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'toolchains'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - *checkout
      - *python
      - *binary
      - *stage
      - name: Install Linux prerequisites and fetch the oracle
        timeout-minutes: 15
        run: |
          source env/env.sh
          timeout --kill-after=10s 120s sudo apt-get update
          timeout --kill-after=10s 300s sudo apt-get install -y --no-install-recommends gcc g++ gfortran ninja-build make binutils
          timeout --kill-after=10s 15m scripts/fetch-oracle.sh --print-env > "$RUNNER_TEMP/rcmake-linux-oracle.env"
      - name: Check ELF dependencies, Fortran modules, and RunCMake suites
        timeout-minutes: 47
        run: |
          source env/env.sh
          source "$RUNNER_TEMP/rcmake-linux-oracle.env"
          scripts/linux-vm-test.sh --extended-only target/stage/bin "$RUNNER_TEMP/runcmake-linux.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runcmake-linux
          path: ${{ runner.temp }}/runcmake-linux.json
          if-no-files-found: ignore

  qt:
    name: Linux Qt 6 AUTOGEN
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'qt'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *binary
      - *stage
      - name: Build and test Qt 6 offscreen
        run: |
          timeout 120s sudo apt-get update
          timeout 300s sudo apt-get install -y --no-install-recommends ninja-build g++ qt6-base-dev qt6-base-dev-tools
          scripts/linux-vm-test.sh --qt-only target/stage/bin

  toolchains:
    name: Linux T2 toolchains
    if: github.event_name == 'schedule' || inputs.lane == 'all' || inputs.lane == 'toolchains'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CUDA_PROVIDER: ${{ inputs.cuda || 'apt' }}
    steps:
      - *checkout
      - *python
      - *binary
      - *stage
      - *oracle
      - name: Install Linux toolchains
        run: |
          source env/env.sh
          timeout 120s sudo apt-get update
          timeout 600s sudo apt-get install -y --no-install-recommends \
            gcc g++ gfortran gcc-arm-none-eabi gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross qemu-user ninja-build
          if [[ "$CUDA_PROVIDER" == apt ]]; then
            timeout 30m sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit g++-12
          fi
      - name: Build Fortran, ARM, and CUDA fixtures
        run: |
          source env/env.sh
          timeout --kill-after=15s 22m python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          root = Path(os.environ["RUNNER_TEMP"]) / "toolchains"
          root.mkdir()
          mock = root / "cuda-toolkit"
          subprocess.run(["python3", "tools/measure/mock_nvcc.py", "--install-mock-toolkit", mock],
                         check=True, timeout=60)
          fixtures = {
              "fortran": ("""project(FortranModules LANGUAGES Fortran)
          add_executable(probe main.f90 number.f90)
          """, {
                  "main.f90": "program main\nuse number\nif (value /= 42) stop 1\nend program\n",
                  "number.f90": "module number\ninteger, parameter :: value = 42\nend module\n",
              }, [], ["./probe"]),
              "bare-metal-arm": ("""project(BareMetal LANGUAGES C)
          add_executable(probe main.c)
          target_link_options(probe PRIVATE -nostdlib -Wl,-e,_start)
          """, {
                  "main.c": "void _start(void) { for (;;) {} }\n",
                  "toolchain.cmake": """set(CMAKE_SYSTEM_NAME Generic)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-none-eabi-gcc)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          """,
              }, ["-DCMAKE_TOOLCHAIN_FILE=toolchain.cmake"], ["arm-none-eabi-readelf", "-h", "./probe"]),
              "linux-arm": ("""project(Emulated LANGUAGES C)
          enable_testing()
          add_executable(probe main.c)
          target_link_options(probe PRIVATE -static)
          add_test(NAME probe COMMAND probe)
          """, {
                  "main.c": "int main(void) { return 0; }\n",
                  "toolchain.cmake": """set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-gnueabihf-gcc)
          set(CMAKE_CROSSCOMPILING_EMULATOR qemu-arm)
          """,
              }, ["-DCMAKE_TOOLCHAIN_FILE=toolchain.cmake"], ["ctest", "--output-on-failure", "--no-tests=error"]),
          }
          cuda_project = """project(CudaProbe LANGUAGES CXX)
          enable_language(CUDA)
          add_executable(probe basic.cu)
          add_executable(separable main.cu device.cu)
          set_property(TARGET separable PROPERTY CUDA_SEPARABLE_COMPILATION ON)
          if(MOCK_CUDA_LINKER)
            set_property(TARGET separable PROPERTY CUDA_LINKER_LAUNCHER "${MOCK_CUDA_LINKER}")
            target_compile_definitions(separable PRIVATE MOCK_CUDA_DEVICE_LINK)
          endif()
          """
          cuda_files = {
              "basic.cu": "__global__ void kernel() {}\nint main() { return 0; }\n",
              "device.cu": "__device__ int value() { return 42; }\n",
              "main.cu": """
          __device__ int value();
          __global__ void kernel() {
          #ifdef MOCK_CUDA_DEVICE_LINK
            (void)value();
          #else
            if (value() != 42) asm("trap;");
          #endif
          }
          #ifdef MOCK_CUDA_DEVICE_LINK
          extern "C" int rcmake_mock_device_link();
          int main() { kernel(); return value() != 42 || rcmake_mock_device_link() != 42; }
          #else
          int main() { return 0; }
          #endif
          """,
          }
          fixtures["cuda-mock"] = (
              cuda_project, cuda_files,
              [f"-DCMAKE_CUDA_COMPILER={mock / 'bin/nvcc'}", "-DCMAKE_CUDA_ARCHITECTURES=75",
               f"-DMOCK_CUDA_LINKER={mock / 'mock/host-link'}"], ["./separable"],
          )
          if os.environ["CUDA_PROVIDER"] == "apt":
              nvcc = shutil.which("nvcc")
              if nvcc is None:
                  raise SystemExit("The apt CUDA compiler is missing.")
              fixtures["cuda-apt"] = (
                  cuda_project, cuda_files,
                  [f"-DCMAKE_CUDA_COMPILER={nvcc}", "-DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++-12",
                   "-DCMAKE_CUDA_ARCHITECTURES=75"], ["cuobjdump", "--extract-elf", "all", "./separable"],
              )

          def check_cuda_log(log, source, build):
              records = [json.loads(line) for line in log.read_text().splitlines()]
              architecture = ["--generate-code=arch=compute_75,code=[compute_75,sm_75]"]

              def require_one(phase, description, matches):
                  found = [row for row in records if row["phase"] == phase and matches(row)]
                  if len(found) != 1 or found[0]["exit_code"] != 0:
                      raise ValueError(f"Expected one successful {description}. Found {found}.")
                  output = Path(found[0]["output"])
                  if not output.is_file() or not output.stat().st_size:
                      raise ValueError(f"{description} did not produce {output}.")
                  return found[0]

              objects = set()
              for name in ("basic.cu", "main.cu", "device.cu"):
                  row = require_one("compile", f"compile of {name}",
                                    lambda row: row["inputs"] == [str(source / name)])
                  if row["architectures"] != architecture or row["relocatable"] != (name != "basic.cu"):
                      raise ValueError(f"Unexpected CUDA flags for {name}: {row['argv']}")
                  if name != "basic.cu":
                      objects.add(row["output"])
              if len(objects) != 2:
                  raise ValueError("The separable sources did not produce distinct objects.")
              device = require_one("device-link", "device link", lambda row: True)
              if (device["architectures"] != architecture or sorted(device["inputs"]) != sorted(objects)
                      or device["output"] in objects):
                  raise ValueError(f"Unexpected device-link command: {device['argv']}")
              final = require_one("host-link", "link of separable",
                                  lambda row: row["output"] == str(build / "separable"))
              if not objects.union({device["output"]}).issubset(final["inputs"]):
                  raise ValueError(f"The final link omitted a separable object: {final['argv']}")

          failures = []
          for fixture, (project, files, args, test) in fixtures.items():
              source = root / fixture
              source.mkdir()
              (source / "CMakeLists.txt").write_text("cmake_minimum_required(VERSION 4.5)\n" + project)
              for filename, content in files.items():
                  (source / filename).write_text(content)
              for engine, variable in (("oracle", "ECOSYSTEM_ORACLE"), ("rcmake", "ECOSYSTEM_RCMAKE")):
                  label = f"{fixture} / {engine}"
                  print(f"::group::{label}", flush=True)
                  cmake = Path(os.environ[variable])
                  build = root / f"{fixture}-{engine}"
                  try:
                      nvcc_log = root / f"{fixture}-{engine}.jsonl"
                      env = {**os.environ, "MOCK_NVCC_LOG": str(nvcc_log)}
                      subprocess.run([cmake, "-S", source, "-B", build, "-G", "Ninja", *args],
                                     env=env, timeout=90, check=True)
                      nvcc_log.unlink(missing_ok=True)
                      subprocess.run([cmake, "--build", build, "--parallel", "2", "--verbose"],
                                     env=env, timeout=150, check=True)
                      if fixture == "cuda-mock":
                          check_cuda_log(nvcc_log, source, build)
                      if test:
                          command = [cmake.with_name("ctest"), *test[1:]] if test[0] == "ctest" else test
                          output = subprocess.check_output(command, cwd=build, timeout=30, text=True)
                          print(output, end="", flush=True)
                          if fixture == "bare-metal-arm" and "ARM" not in output:
                              raise ValueError("The executable does not target ARM.")
                          if fixture == "cuda-apt" and not any(
                                  image.stat().st_size > 4 and image.read_bytes()[:4] == b"\x7fELF"
                                  for image in build.glob("*.sm_75.cubin")):
                              raise ValueError("The executable has no sm_75 ELF device image.")
                  except (KeyError, OSError, TypeError, ValueError, subprocess.SubprocessError) as error:
                      print(error, flush=True)
                      failures.append(label)
                  finally:
                      print("::endgroup::", flush=True)
          if failures:
              raise SystemExit("Failed fixtures: " + ", ".join(failures))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cuda-build-logs
          path: ${{ runner.temp }}/toolchains/cuda-*.jsonl
          if-no-files-found: ignore
