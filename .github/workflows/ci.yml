name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_measurement_gates:
        description: "Run the full replay and probe-cache gates."
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "3"

jobs:
  ci:
    name: CI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang ninja-build make binutils libzstd1
      - &macos_tools
        name: Check macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          xcodebuild -version
          for tool in otool codesign python3 ninja; do
            command -v "$tool"
          done
          ninja --version
      - &vs2022
        name: Install Visual Studio 2022 Build Tools
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 25
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $search = @('-latest', '-products', '*', '-version', '[17.0,18.0)',
                      '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                      '-property', 'installationPath')
          $instance = & $vswhere @search
          if (-not $instance) {
            $installer = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
            Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vs_buildtools.exe' -OutFile $installer
            $arguments = @('--quiet', '--wait', '--norestart', '--nocache',
                           '--add', 'Microsoft.VisualStudio.Workload.VCTools',
                           '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
                           '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100')
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -notin 0, 3010) { throw "Build Tools installer exited with $($process.ExitCode)." }
            $instance = & $vswhere @search
          }
          if (-not $instance) { throw 'Visual Studio 2022 Build Tools are missing.' }
          "RCMAKE_VS2022_INSTALLATION=$instance" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Join-Path $instance 'MSBuild\Current\Bin\amd64' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - &msvc
        uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          vsversion: "2022"
      - &windows_tools
        name: Verify MSVC 2022 and Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VisualStudioVersion -notlike '17.*' -or
              $env:VSINSTALLDIR.TrimEnd('\') -ne $env:RCMAKE_VS2022_INSTALLATION.TrimEnd('\')) {
            throw "Expected Visual Studio 2022. Found $env:VisualStudioVersion at $env:VSINSTALLDIR."
          }
          if (-not (Get-Command ninja.exe -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Ninja installer exited with $LASTEXITCODE." }
          }
          foreach ($name in 'cl.exe', 'link.exe', 'lib.exe', 'rc.exe', 'mt.exe') {
            $path = (Get-Command $name -CommandType Application).Source
            if ($name -in 'cl.exe', 'link.exe', 'lib.exe' -and
                -not $path.StartsWith($env:VCToolsInstallDir, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Expected $name from MSVC 2022. Found $path."
            }
            $version = (Get-Item -LiteralPath $path).VersionInfo.FileVersion
            Write-Host "$name $version at $path"
          }
          Write-Host "Windows SDK $env:WindowsSDKVersion at $env:WindowsSdkDir"
          Get-Command MSBuild.exe, ninja.exe -CommandType Application
          ninja.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Ninja exited with $LASTEXITCODE." }
          $linker = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "The Visual Studio linker is missing at $linker."
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Visual Studio linker at $linker"

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: |
          source env/env.sh
          cargo fmt --all -- --check
      - name: Run Clippy
        run: |
          source env/env.sh
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Clippy with cross-platform generators
        if: runner.os == 'Linux'
        run: |
          source env/env.sh
          cargo clippy --locked -p rcmake-cli --features vs-cross,xcode-cross --all-targets -- -D warnings
      - name: Build Rust documentation
        if: runner.os == 'Linux'
        run: |
          source env/env.sh
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
      - name: Check licences and Git hygiene
        if: runner.os == 'Linux'
        run: |
          source env/env.sh
          python3 tools/measure/licence_scan.py --check-hygiene
      - name: Run workspace tests
        run: |
          source env/env.sh
          cargo test --locked --workspace --no-fail-fast

      - name: Stage Rcmake
        run: |
          if [[ "$RUNNER_OS" != Windows ]]; then
            scripts/stage.sh
          else
            source env/env.sh
            cargo build --locked --bin rcmake --target-dir target
            mkdir -p target/stage/bin target/stage/share
            for tool in rcmake cmake ctest cpack; do
              cp target/debug/rcmake.exe "target/stage/bin/$tool.exe"
            done
            cp -R modules/cmake-4.5 target/stage/share/
          fi
      - name: Test native C and C++ builds
        timeout-minutes: 15
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            command -v cygpath
            msvc_bin="$(cygpath -u "${VCToolsInstallDir%\\}/bin/Hostx64/x64")"
            export PATH="$msvc_bin:$PATH"
            for tool in link.exe cl.exe; do
              test "$(command -v "$tool")" = "$msvc_bin/$tool"
            done
            command -v ninja
            command -v python
          fi
          scripts/linux-vm-test.sh --smoke-only target/stage/bin
      - name: Run measurement smoke tests with CMake 4.5.1
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          source env/env.sh
          oracle_env="$(scripts/fetch-oracle.sh --print-env)"
          eval "$oracle_env"
          reports="$RUNNER_TEMP/measurement"
          mkdir -p "$reports"
          python3 tools/measure/mutation_eval.py --smoke --rcmake target/stage/bin/rcmake \
            --edits 8 --timeout 30 --out-json "$reports/mutation.json" --out-md "$reports/mutation.md"
          python3 tools/measure/probe_cache_eval.py --smoke --rcmake target/stage/bin/rcmake \
            --timeout 30 --out-json "$reports/probe.json" --out-md "$reports/probe.md"
          python3 tools/measure/path_swap_eval.py --smoke --rcmake-bin target/stage/bin/rcmake \
            --timeout 30 --out "$reports/path-swap.json"
      # Require the full replay and probe-cache gates when the configure path enables both.
      - name: Run full measurement gates
        if: runner.os == 'Linux' && inputs.full_measurement_gates
        timeout-minutes: 35
        run: |
          source env/env.sh
          oracle_env="$(scripts/fetch-oracle.sh --print-env)"
          eval "$oracle_env"
          reports="$RUNNER_TEMP/measurement"
          failed=0
          python3 tools/measure/mutation_eval.py --fixture --rcmake target/stage/bin/rcmake \
            --out-json "$reports/mutation-gate.json" --out-md "$reports/mutation-gate.md" || failed=1
          python3 tools/measure/probe_cache_eval.py --rcmake target/stage/bin/rcmake \
            --out-json "$reports/probe-gate.json" --out-md "$reports/probe-gate.md" || failed=1
          python3 tools/measure/path_swap_eval.py --rcmake-bin target/stage/bin/rcmake \
            --out "$reports/path-swap-gate.json" || failed=1
          exit "$failed"
      - uses: actions/upload-artifact@v6
        if: always() && runner.os == 'Linux'
        with:
          name: rcmake-measurement
          path: ${{ runner.temp }}/measurement
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          name: rcmake-ci-${{ matrix.os }}
          path: |
            target/stage/bin/rcmake
            target/stage/bin/rcmake.exe
          if-no-files-found: error
          retention-days: 3

  corpus-smoke:
    name: Corpus smoke on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: ci
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: rcmake-ci-${{ matrix.os }}
          path: target/stage/bin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - *vs2022
      - *msvc
      - *windows_tools
      - if: runner.os == 'Linux'
        name: Install Ninja on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - *macos_tools
      - name: Build, test, and install zlib and cJSON
        shell: bash
        run: |
          mkdir -p target/stage/share
          cp -R modules/cmake-4.5 target/stage/share/
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          import tomllib

          sys.path.insert(0, "tools/measure")
          from corpus_eval import MANIFEST, cached_archive, extract

          stage = Path("target/stage/bin").resolve()
          suffix = ".exe" if os.name == "nt" else ""
          rcmake = stage / f"rcmake{suffix}"
          rcmake.chmod(0o755)
          cmake, ctest = (stage / f"{tool}{suffix}" for tool in ("cmake", "ctest"))
          for tool in (cmake, ctest):
              shutil.copyfile(rcmake, tool)
              tool.chmod(0o755)

          pins = {pin["name"]: pin for pin in tomllib.loads(MANIFEST.read_text())["project"]}
          with TemporaryDirectory(prefix="rcmake-ci-corpus-") as temporary:
              for name in ("zlib", "cJSON"):
                  print(f"Test {name}.", flush=True)
                  work = Path(temporary) / name
                  work.mkdir()
                  pin = pins[name]
                  source = extract(cached_archive(pin), work / "source")
                  build = work / "build"
                  prefix = work / "install"
                  compiler = ["-DCMAKE_C_COMPILER=cl.exe"] if os.name == "nt" else []
                  # zlib sets absolute install destinations during configuration.
                  subprocess.run([cmake, "-S", source, "-B", build, "-G", "Ninja",
                                  "-DCMAKE_BUILD_TYPE=Release",
                                  f"-DCMAKE_INSTALL_PREFIX={prefix.as_posix()}", *compiler,
                                  *pin["configure_args"]], check=True, timeout=300)
                  subprocess.run([cmake, "--build", build, "--parallel", "2"], check=True, timeout=300)
                  test_env = os.environ.copy()
                  if os.name == "nt":
                      # cJSON tests run in a subdirectory of the DLL output directory.
                      test_env["PATH"] = str(build) + os.pathsep + test_env["PATH"]
                  subprocess.run([ctest, "--test-dir", build, "--output-on-failure", "--no-tests=error"],
                                 env=test_env, check=True, timeout=300)
                  subprocess.run([cmake, "--install", build, "--prefix", prefix], check=True, timeout=300)
                  if not any(path.is_file() for path in prefix.rglob("*")):
                      sys.exit(f"{name} did not install any files.")
          PY
