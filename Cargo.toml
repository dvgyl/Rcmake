[workspace]
resolver = "3"
members = [
    "crates/rcmake-base",
    "crates/rcmake-json",
    "crates/rcmake-diag",
    "crates/rcmake-syntax",
    "crates/rcmake-host",
    "crates/rcmake-regex",
    "crates/rcmake-expr",
    "crates/rcmake-model",
    "crates/rcmake-genex",
    "crates/rcmake-eval",
    "crates/rcmake-resolve",
    "crates/rcmake-build",
    "crates/rcmake-presets",
    "crates/rcmake-archive",
    "crates/rcmake-commands",
    "crates/rcmake-gen-common",
    "crates/rcmake-gen-ninja",
    "crates/rcmake-gen-make",
    "crates/rcmake-ctest",
    "crates/rcmake-cps",
    "crates/rcmake-cxxmodules",
    "crates/rcmake-fortran",
    "crates/rcmake-store",
    "crates/rcmake-fetch",
    "crates/rcmake-lsp",
    "crates/rcmake-instrument",
    "crates/rcmake-cpack",
    "crates/rcmake-tool-e",
    "crates/rcmake-gen-xcode",
    "crates/rcmake-gen-vs",
    "crates/rcmake-cli",
    "crates/rcmake-harness",
    "crates/rcmake-fuzz",
    "crates/rcmake-api",
    "crates/rcmake-wasm",
]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dvgyl/rcmake"
homepage = "https://github.com/dvgyl/rcmake"

[workspace.dependencies]
bstr = { version = "1.12", default-features = false, features = ["std", "alloc"] }
# Default backend is the pure-Rust `libbz2-rs-sys` (no C compiler, no system libbz2).
bzip2 = "0.6"
flate2 = "1"
indexmap = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
liblzma = { version = "0.4", default-features = false, features = ["static"] }
md-5 = "0.10"
memchr = "2"
rustix = { version = "1", features = ["fs", "process", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
similar = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
zstd = { version = "0.14", default-features = false }

# Internal workspace crates
rcmake-base = { path = "crates/rcmake-base" }
rcmake-json = { path = "crates/rcmake-json" }
rcmake-diag = { path = "crates/rcmake-diag" }
rcmake-syntax = { path = "crates/rcmake-syntax" }
rcmake-host = { path = "crates/rcmake-host" }
rcmake-regex = { path = "crates/rcmake-regex" }
rcmake-expr = { path = "crates/rcmake-expr" }
rcmake-model = { path = "crates/rcmake-model" }
rcmake-eval = { path = "crates/rcmake-eval" }
rcmake-presets = { path = "crates/rcmake-presets" }
rcmake-archive = { path = "crates/rcmake-archive" }
rcmake-commands = { path = "crates/rcmake-commands", default-features = false }
rcmake-api = { path = "crates/rcmake-api", default-features = false }
rcmake-tool-e = { path = "crates/rcmake-tool-e" }
rcmake-genex = { path = "crates/rcmake-genex" }
rcmake-resolve = { path = "crates/rcmake-resolve" }
rcmake-build = { path = "crates/rcmake-build" }
rcmake-gen-common = { path = "crates/rcmake-gen-common" }
rcmake-gen-ninja = { path = "crates/rcmake-gen-ninja" }
rcmake-gen-make = { path = "crates/rcmake-gen-make" }
rcmake-gen-xcode = { path = "crates/rcmake-gen-xcode" }
rcmake-gen-vs = { path = "crates/rcmake-gen-vs" }
rcmake-ctest = { path = "crates/rcmake-ctest" }
rcmake-cps = { path = "crates/rcmake-cps" }
rcmake-cxxmodules = { path = "crates/rcmake-cxxmodules" }
rcmake-fortran = { path = "crates/rcmake-fortran" }
rcmake-store = { path = "crates/rcmake-store" }
rcmake-fetch = { path = "crates/rcmake-fetch", default-features = false }
rcmake-lsp = { path = "crates/rcmake-lsp", default-features = false }
rcmake-instrument = { path = "crates/rcmake-instrument" }
rcmake-cpack = { path = "crates/rcmake-cpack" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
indexing_slicing = "warn"
string_slice = "warn"
iter_over_hash_type = "warn"
disallowed_methods = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release.package.jiff]
opt-level = "s"

[profile.release.package.libbz2-rs-sys]
opt-level = "z"

[profile.release.package.liblzma-sys]
opt-level = "z"

[profile.release.package.lzma-rust2]
opt-level = "z"

[profile.release.package.ppmd-turbo]
opt-level = "z"

[profile.release.package.rcmake-archive]
opt-level = "s"

[profile.release.package.rcmake-cpack]
opt-level = "z"

[profile.release.package.rcmake-cps]
opt-level = "s"

[profile.release.package.rcmake-ctest]
opt-level = "z"

[profile.release.package.rcmake-fetch]
opt-level = "s"

[profile.release.package.rcmake-gen-vs]
opt-level = "s"

[profile.release.package.rcmake-gen-xcode]
opt-level = "s"

[profile.release.package.rcmake-instrument]
opt-level = "s"

[profile.release.package.rcmake-lsp]
opt-level = "z"

[profile.release.package.rcmake-presets]
opt-level = "s"

[profile.release.package.rcmake-store]
opt-level = "s"

[profile.release.package.rcmake-tool-e]
opt-level = "z"

[profile.release.package.sevenz-rust2]
opt-level = "z"

[profile.release.package.tar]
opt-level = "z"

[profile.release.package.zip]
opt-level = "z"

[profile.release.package.zlib-rs]
opt-level = "z"

[profile.release.package.zstd-sys]
opt-level = "z"

[profile.release.package.rcmake-commands]
opt-level = "s"

[profile.release.package.rcmake-gen-common]
opt-level = "s"

[profile.size-probe]
inherits = "release"
strip = false
debug = false

[profile.fuzz]
inherits = "release"
panic = "unwind"

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release.package.jiff]
opt-level = "z"

[profile.wasm-release.package.rcmake-cps]
opt-level = "z"

[profile.wasm-release.package.rcmake-instrument]
opt-level = "z"

[profile.wasm-release.package.rcmake-presets]
opt-level = "z"

[profile.wasm-release.package.rcmake-commands]
opt-level = "z"

[profile.wasm-release.package.rcmake-gen-common]
opt-level = "z"
