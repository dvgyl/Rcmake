[[project]]
name = "sqlite"
tier = 2
version = "3.50.4"
url = "https://www.sqlite.org/2025/sqlite-autoconf-3500400.tar.gz"
sha256 = "a3db587a1b92ee5ddac2f66b3edb41b26f9c867275782d46c3a088977d6a5b18"
licence = "Public domain"
configure_args = []
test_enabled = true
notes = "The evaluator uses this CMake wrapper to build the upstream amalgamation and test an in-memory query."
cmakelists = '''
cmake_minimum_required(VERSION 3.15)
project(sqlite LANGUAGES C)

find_package(Threads REQUIRED)
add_library(sqlite3 sqlite3.c)
target_link_libraries(sqlite3 PRIVATE Threads::Threads ${CMAKE_DL_LIBS})

add_executable(sqlite_shell shell.c)
set_target_properties(sqlite_shell PROPERTIES OUTPUT_NAME sqlite3)
target_link_libraries(sqlite_shell PRIVATE sqlite3)
if(UNIX)
    target_link_libraries(sqlite_shell PRIVATE m)
endif()

include(GNUInstallDirs)
install(TARGETS sqlite3 sqlite_shell)
install(FILES sqlite3.h sqlite3ext.h DESTINATION "${CMAKE_INSTALL_INCLUDEDIR}")

enable_testing()
add_test(NAME query COMMAND sqlite_shell ":memory:" "SELECT 6 * 7;")
set_tests_properties(query PROPERTIES PASS_REGULAR_EXPRESSION "42")
'''

