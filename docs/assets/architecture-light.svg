<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="Rcmake compiler and build-system generation pipeline">
  <title>Rcmake Architecture Pipeline</title>
  <defs>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.25; rx: 8; }
    .accent { fill: #FFF7F5; stroke: #D94D26; stroke-width: 1.25; rx: 8; }
    .blue { fill: #F4F8FF; stroke: #2F74E8; stroke-width: 1.25; rx: 8; }
    .host { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.25; stroke-dasharray: 5 4; rx: 8; }
    .h { font-size: 13px; font-weight: 650; fill: #0F172A; }
    .s { font-size: 11px; fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .line { stroke: #64748B; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Stage 1 -->
  <rect class="box" x="14" y="20" width="142" height="106"/>
  <text class="h" x="85" y="45" text-anchor="middle">Frontend &amp; CLI</text>
  <text class="s" x="85" y="68" text-anchor="middle">rcmake-cli</text>
  <text class="s" x="85" y="85" text-anchor="middle">rcmake-syntax</text>
  <text class="s" x="85" y="102" text-anchor="middle">rcmake-presets</text>
  <text class="s" x="85" y="117" text-anchor="middle">rcmake-diag (SARIF)</text>

  <path class="line" d="M156 73 L184 73" marker-end="url(#arrow-l)"/>

  <!-- Stage 2 -->
  <rect class="accent" x="188" y="20" width="154" height="106"/>
  <text class="h" x="265" y="45" text-anchor="middle">Evaluator</text>
  <text class="s" x="265" y="68" text-anchor="middle">rcmake-eval</text>
  <text class="s" x="265" y="85" text-anchor="middle">rcmake-commands</text>
  <text class="s" x="265" y="102" text-anchor="middle">rcmake-expr / regex</text>
  <text class="s" x="265" y="117" text-anchor="middle">rcmake-build (probes)</text>

  <path class="line" d="M342 73 L370 73" marker-end="url(#arrow-l)"/>

  <!-- Stage 3 -->
  <rect class="box" x="374" y="20" width="142" height="106"/>
  <text class="h" x="445" y="45" text-anchor="middle">Model &amp; Resolve</text>
  <text class="s" x="445" y="68" text-anchor="middle">rcmake-model</text>
  <text class="s" x="445" y="85" text-anchor="middle">rcmake-genex</text>
  <text class="s" x="445" y="102" text-anchor="middle">rcmake-resolve</text>
  <text class="s" x="445" y="117" text-anchor="middle">rcmake-cxxmodules</text>

  <path class="line" d="M516 73 L544 73" marker-end="url(#arrow-l)"/>

  <!-- Stage 4 -->
  <rect class="blue" x="548" y="20" width="148" height="106"/>
  <text class="h" x="622" y="45" text-anchor="middle">Generators</text>
  <text class="s" x="622" y="68" text-anchor="middle">Ninja / Multi-Config</text>
  <text class="s" x="622" y="85" text-anchor="middle">Unix Makefiles</text>
  <text class="s" x="622" y="102" text-anchor="middle">Xcode · Visual Studio</text>
  <text class="s" x="622" y="117" text-anchor="middle">File-API · CPS · SBOM</text>

  <path class="line" d="M696 73 L724 73" marker-end="url(#arrow-l)"/>

  <!-- Stage 5 -->
  <rect class="box" x="728" y="20" width="138" height="106"/>
  <text class="h" x="797" y="45" text-anchor="middle">Tools &amp; Drivers</text>
  <text class="s" x="797" y="68" text-anchor="middle">rcmake-ctest</text>
  <text class="s" x="797" y="85" text-anchor="middle">rcmake-cpack</text>
  <text class="s" x="797" y="102" text-anchor="middle">rcmake-tool-e (-E)</text>
  <text class="s" x="797" y="117" text-anchor="middle">rcmake-archive</text>

  <!-- Host foundation bar -->
  <rect class="host" x="14" y="156" width="852" height="64"/>
  <text class="h" x="440" y="182" text-anchor="middle">Deterministic Host Abstraction (rcmake-host) &amp; Shared Primitives (rcmake-base · rcmake-json)</text>
  <text class="s" x="440" y="203" text-anchor="middle">NativeHost (OS FS, flock, env, process, clock)  ·  PureHost (in-memory tests &amp; fuzzing)  ·  #![forbid(unsafe_code)]</text>

  <!-- Vertical connectors -->
  <path class="line" d="M85 126 L85 152" marker-end="url(#arrow-l)"/>
  <path class="line" d="M265 126 L265 152" marker-end="url(#arrow-l)"/>
  <path class="line" d="M445 126 L445 152" marker-end="url(#arrow-l)"/>
  <path class="line" d="M622 126 L622 152" marker-end="url(#arrow-l)"/>
  <path class="line" d="M797 126 L797 152" marker-end="url(#arrow-l)"/>
</svg>
